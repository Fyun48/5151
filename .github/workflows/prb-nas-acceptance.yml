name: PR-B disposable NAS acceptance
run-name: "PR-B NAS ${{ inputs.source_sha }}"
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character PR #497 code SHA with completed green CI"
        required: true
      confirmation:
        description: "Type VERIFY-PRB-NAS; disposable CasaOS benchmark; no production database changes"
        required: true
permissions:
  contents: read
  checks: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: casa
            hostname: ssh-casa.reversalplay.me
            fingerprint: SHA256:UpwkuYsK0rsIDIBBn6JabtCmdSbHC9fxerq8VyEo42w
    steps:
      - name: Authorize manual NAS benchmark
        env:
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Fyun48/5151
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/master
          test -n "$ALLOWED_ACTOR"
          test "$CONFIRMATION" = VERIFY-PRB-NAS
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ ( "$GITHUB_ACTOR" == cursor || "$GITHUB_ACTOR" == 'cursor[bot]' ) &&
                ( "$GITHUB_TRIGGERING_ACTOR" == cursor || "$GITHUB_TRIGGERING_ACTOR" == 'cursor[bot]' ) ]]; then
            exit 0
          fi
          test "$GITHUB_ACTOR" = "$ALLOWED_ACTOR"
          test "$GITHUB_TRIGGERING_ACTOR" = "$ALLOWED_ACTOR"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted script syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n .github/scripts/prb-nas-acceptance-remote.sh
      - name: Require green checks on the exact requested code SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/Fyun48/5151/commits/$SOURCE_SHA/check-runs?per_page=100" > checks.json
          python3 - <<'PYCHECK'
          import json
          checks = json.load(open('checks.json'))['check_runs']
          required = {'Run Tests', 'Run Tests (PostgreSQL integration)', 'GitGuardian Security Checks', 'Review diff with the configured model'}
          latest = {}
          for row in checks:
              if row['name'] not in latest or row['id'] > latest[row['name']]['id']:
                  latest[row['name']] = row
          assert required <= latest.keys(), 'Missing required exact-SHA checks'
          assert all(latest[name]['status'] == 'completed' and latest[name]['conclusion'] == 'success' for name in required), 'Exact-SHA checks are not green'
          PYCHECK
      # Do NOT provide ssh-user/key to the legacy bridge: its optional smoke
      # test disables host verification. The authenticated check below pins it.
      - name: Existing Cloudflare Access bridge
        id: bridge
        uses: ./.github/actions/cf-ssh-bridge
        with:
          hostname: ${{ matrix.hostname }}
          port: "2222"
          cloudflared-url: https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Verify host fingerprint then run disposable acceptance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          NAS_ROLE: ${{ matrix.role }}
          NAS_HOST: ${{ steps.bridge.outputs.host }}
          NAS_PORT: ${{ steps.bridge.outputs.port }}
          NAS_FINGERPRINT: ${{ matrix.fingerprint }}
          NAS_USER: ${{ matrix.role == 'casa' && secrets.NAS_USER || secrets.V3_SYNOLOGY_USER }}
          NAS_KEY: ${{ matrix.role == 'casa' && secrets.NAS_SSH_KEY || secrets.V3_SYNOLOGY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          inventory_tmp="$(mktemp -d)"
          trap 'rm -rf "$inventory_tmp"' EXIT
          test -n "$NAS_USER"
          test -n "$NAS_KEY"
          printf '%s\n' "$NAS_KEY" > "$inventory_tmp/key"
          ssh-keyscan -T 15 -t ed25519 -p "$NAS_PORT" "$NAS_HOST" > "$inventory_tmp/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$inventory_tmp/known_hosts" -E sha256 | awk '{print $2}')" = "$NAS_FINGERPRINT"
          mkdir -p evidence
          printf 'workflow_sha=%s run_id=%s role=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$NAS_ROLE" > "evidence/$NAS_ROLE.txt"
          timeout --kill-after=5s 1300s ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$inventory_tmp/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -p "$NAS_PORT" -i "$inventory_tmp/key" \
            "$NAS_USER@$NAS_HOST" bash -s -- "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            < .github/scripts/prb-nas-acceptance-remote.sh > evidence/nas-evidence.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: prb-nas-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Report actual NAS result after preserving evidence
        run: |
          set -euo pipefail
          python3 - <<'PYRESULT'
          import tarfile, json
          with tarfile.open('evidence/nas-evidence.tar.gz') as archive:
              code = int(archive.extractfile('./runner-exit.txt').read().decode().strip())
              clean = archive.extractfile('./cleanup-ok.txt').read().decode().strip()
              report = json.load(archive.extractfile('./prb-search-benchmark.json'))
              import os
              assert report['sourceSha'] == os.environ['SOURCE_SHA']
              assert report['checkoutSha'] == os.environ['SOURCE_SHA']
              print('NAS_RUNNER_EXIT=' + str(code) + ' CLEANUP_OK=' + clean)
              assert clean == 'true', 'Acceptance resource cleanup incomplete'
              assert code == 0, 'NAS hard gate FAIL; original evidence preserved (performance exception is a separate release decision)'
          PYRESULT
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}

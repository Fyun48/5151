name: Tests

on:
  push:
    branches: [master, main]

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review


permissions:
  contents: read


jobs:

  test:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm test

name: Docker image (manual)

# 明確手動觸發：建置並推送映像，並在 CasaOS 上拉取重啟正式容器。
# 合併/push 到 master（含 package.json 變更）不會自動建置或動到正式站。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要建置的 git ref / 分支 / tag / commit SHA（預設 master）"
        required: false
        default: master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 拉取重啟正式容器會用到 NAS 密鑰；限定在 'production' environment。
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/5151/visibility" \
            -f visibility=public
      - name: Pull runtime image on CasaOS
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /mnt/Storage1/apps/5151
            docker compose stop 591-tracker || true
            docker stop 591-tracker || true
            docker rm -f 591-tracker || true
            docker compose pull 591-tracker-v2 591-tracker-v3 || docker compose pull
            docker compose up -d --no-build --no-deps 591-tracker-v2 591-tracker-v3

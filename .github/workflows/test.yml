name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Tests only. No review gate, auto-fix, auto-merge, or deployment.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        shell: bash
        run: |
          set -euo pipefail
          npm test

  # astra §3（2026-09-25）：PG 專屬回歸必須在**真 PG**上跑，但**不得**用 job 全域 DB_DRIVER=postgres
  # 把一般 job 的 SQLite／預設 driver 測試整批改成 PG（那會漏測並掩蓋隔離問題）。
  # 因此這裡走獨立入口 `npm run test:pg`：先鏡射 schema，再跑 canary ＋ 所有 PG_TEST_URL-gated 整合測試。
  # 資料庫是**拋棄式**的：絕不把生產連線交給 Actions（PG_URL 只在本 job 指向 service container）。
  test-postgres:
    name: Run Tests (PostgreSQL integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # 固定版本，避免 CI 隨上游漂移（正式環境是 PG 16.14）
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # 統一的測試連線契約：應用 driver 讀 PG_URL，live PG 測試讀 PG_TEST_URL（astra §3.3）
      PG_URL: postgres://postgres:postgres@127.0.0.1:5432/tracker_test
      PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/tracker_test
      PG_STATEMENT_TIMEOUT_MS: "300000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:pg

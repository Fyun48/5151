# 5151 Shadow HA — HAProxy 權威設定（正式機現行檔的鏡像；**本檔不是 template**）
#
# ⚠️ 2026-10-12：本檔 = casa-nas／syn-nas **兩台正式機現行檔**（拿掉註解與空行後逐字相同、差異 0）。
#    - 檔內一律寫**實體 IP**：192.168.0.140 = casa-nas、192.168.0.220 = syn-nas。
#      **沒有** `${CASAOS_HOST}`／`${SYNOLOGY_HOST}` 佔位符；容器啟動時也**沒有**任何展開步驟。
#      舊文件寫的 `.cfg.tmpl`／`render-and-run.sh`／容器內 `/tmp/haproxy.cfg` 那一層已作廢
#      （`render-and-run.sh` 已刪除），看到任何還在講 template 的說明就是舊的。
#    - 兩台容器都跑 `haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg`，且該檔是**單檔 bind mount**
#      （casa：`/opt/5151-shadow/haproxy/haproxy.cfg`；syn：`~/5151-shadow/haproxy/haproxy.cfg`）
#      ⇒ 套用只能「就地改寫同一個 inode」＋`haproxy -c`＋`kill -s USR2 1`；`mv` 換新檔容器仍看到舊 inode。
#      完整程序與回滾見 `docs/runbooks/haproxy-web-weight.md`。
#    - 2026-10-12 起 `backend pg_standby_first`（讀取池，25434）**也是角色感知**：
#      兩條 server 都吃 `agent-check agent-port 25437`（up-if-standby），`backup` 標記移除。
#      決策＝ **D-0040**（`/home/cline/agent-brain/memory/decisions.md`）；讀取走待機的開閘程序見
#      `docs/runbooks/member-read-replica-routing.md`（未設 `PG_RO_URL` 時＝不開閘）。
#      改這個 block 前先讀 runbook §0.1：**只改你要改的那幾行**，不要整份覆蓋。
#    - `.github/workflows/deploy-v3.yml` **不會**把本檔蓋到正式機（它只做部署後 health check），
#      所以「改了 repo 就自動生效」是錯的：本檔是權威來源，但套用一律手動。
#    - CI 守門：`.github/workflows/test.yml` 的 "Validate HAProxy config" 步驟用官方映像
#      `haproxy:2.9-alpine haproxy -c -f …` 離線驗本檔語法（不碰正式機；見 runbook §5）。
#
# Listens（容器埠；宿主對應見 docker-compose.yml／docker-compose.synology.yml）:
#   25433  postgres-rw   (only the current primary)
#   25434  postgres-ro   (standby first, primary fallback)
#   15153  web           (weighted Web-A / Web-B；兩台宿主都發佈為 25153)
#   8404   stats         (listen internal_stats；宿主只綁 127.0.0.1:25154)
# Health checks must distinguish primary / standby / web; the router must NOT
# promote PostgreSQL itself (promotion is manual — see the failover runbook).

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 2

# --- PostgreSQL routing -------------------------------------------------
# Native PostgreSQL auth check proves the server accepts connections. For
# primary/standby role separation, `postgres-rw` points only at the primary
# and `postgres-ro` prefers the standby. 2026-10-09 起角色不再靠人工排序，
# 而是由每個節點上的 pg-agent（agent-check）判定；promote 仍是手動。

frontend pg_rw
    bind *:25433
    default_backend pg_primary

frontend pg_ro
    bind *:25434
    default_backend pg_standby_first

backend pg_primary
    # 角色由 agent-check 判定（2026-10-09 實上線，2026-10-12 逐字同步回本檔）：
    # 兩台節點各有一個 pg-agent responder（25436 = up-if-primary、25437 = up-if-standby），
    # `balance first` ＋ 兩條 server 都吃 agent 的健康狀態 ⇒ 只有「自稱 primary」的那台會被選中。
    # pg-b **刻意不帶 `backup`**：`backup` 是靜態標記，會在「沒有任何節點自稱 primary」時
    # 仍被當成備援而接到寫入 —— 本專案最硬的約束是**寫入只能到 primary**（read-only transaction
    # 會直接讓寫入全滅），所以寧可 fail-closed。
    balance first
    option pgsql-check user postgres
    server pg-a 192.168.0.140:15432 check inter 3s fall 3 rise 2 agent-check agent-port 25436 agent-inter 2s
    server pg-b 192.168.0.220:15432 check inter 3s fall 3 rise 2 agent-check agent-port 25436 agent-inter 2s
    # 語法限制（haproxy 2.9.15 實測，CI 的 `haproxy -c` 會擋）：
    #   * server 行的關鍵字是 `agent-check agent-port <port> agent-inter <n>s`。
    #   * **沒有** `agent-fall`／`agent-rise`，也**沒有** backend 級 `option agent-check`
    #     （兩者實測都報 unknown keyword／unknown option）。
    #   * `agent-check` 沒有防抖 ⇒ 波動抑制要放在 responder 端。
    #   * `25434` 已被 `frontend pg_ro` 占用，故 agent 埠用 25436（primary 埠）／25437（standby 埠）。
    # 判讀：正常狀態下 `pg_primary/pg-b` 是 `DOWN (agent)`（待命庫被踢出寫入池，這是**預期**不是故障）；
    #       `pg_primary/pg-a` 應為 `UP`；`pg_standby_first` 則是**只有自報待機的那台 UP**。
    #       （2026-10-12 之前 `pg_standby_first` 兩台都會 UP（`pg-b bck=1`），那是「這個 backend 分不出角色」
    #        的症狀，不是正常；換成 25437 agent-check 之後才會只剩一台。）

backend pg_standby_first
    option pgsql-check user postgres
    # 角色由 agent-check 判定（2026-10-12 改，決策 D-0040；本 block 是「讀取池」）：
    #   兩條 server 都吃 **25437（up-if-standby 埠）** ⇒ 只有「自報待機」的那台會 UP。
    #   上面那條 `option pgsql-check` 留著當**連通性**雙重檢查（它只問「PG 有沒有在應答」，
    #   **分不出角色**；2026-10-12 07:10 實測：兩台都會答 ⇒ 只用它就會讓讀取永遠落在 primary）。
    #
    # 排序與 `backup` 的裁決（本 block 唯一的設計題）：
    #   採 **(i) 兩條都不帶 `backup`，server 行維持 pg-a 在前**；**不加 `balance first`**。
    #   * 為什麼不帶 `backup`：`backup` 是**靜態**標記，語意是「正式成員全 DOWN 時才輪到我」。
    #     在 agent-check 下，primary 那台的 25437 會回 `down` ⇒ 它被判 DOWN；此時若它還掛著 `backup`
    #     （= 方案 ii 保留 `pg-b backup`），HAProxy 會**照樣把新連線丟給一台已知 DOWN 的 server**
    #     ⇒ 讀取在「casa 是 primary」的平常狀態下反而落到 primary，等於白做、還多一個矛盾的 `bck` 狀態。
    #     拿掉 `backup` 之後，「沒有任何節點自報待機」就＝整個 backend 沒有 UP server。
    #   * 為什麼不保留舊的 `pg-a` 優先排序當 fallback：那正是壞掉的東西。`balance first`（或任何
    #     依賴「清單順序」的偏好）只在**兩個 server 同時 UP**時才表現出差異；正常運作下 agent 只讓一台 UP，
    #     所以順序不再是正確性的來源，留著只會讓下一個人以為「排前面就會先被選」。
    #   * 為什麼不加 `balance first`（與 `pg_primary` 刻意不對稱）：加了會引入一個沒人驗過的 tie-break
    #     ——「兩台同時自報 standby」（例如 promote 剛發生、responder 尚未跟上）時選誰，本包沒有資料。
    #     不加的話，同時 UP 時仍是「清單上前的那條」＝ pg-a，與**改動前**的行為一致（可回滾、可解釋）。
    #     角色互換時的正確性完全由 25437 負責（syn 變 primary ⇒ 它回 `down`、casa 回 `up` ⇒ 讀取自動跟隨）。
    #   * 代價（明示）：25437 是**唯一**的角色來源；兩台 responder 同時掛 ⇒ 讀取池沒有 UP server ⇒
    #     **新連線一律被拒（fail-closed）**。這是**我們要的**行為：程式端（`v3/src/pgReadReplica.js`／
    #     `pgReadSnapshot.js`，`master=62b4d25`）本來就設計成「待機拿不到連線 ⇒ 整趟退回 primary」
    #     （2 秒連線逾時 ＋ 3 秒冷卻），所以使用者只會變成走 primary（較慢），不會看到 5xx。
    server pg-a 192.168.0.140:15432 check inter 3s fall 3 rise 2 agent-check agent-port 25437 agent-inter 2s
    server pg-b 192.168.0.220:15432 check inter 3s fall 3 rise 2 agent-check agent-port 25437 agent-inter 2s
    # 語法同 `pg_primary`：只有 `agent-check agent-port <埠> agent-inter <時間>`；
    # **沒有** `agent-fall`／`agent-rise`（2.9.15 報 unknown keyword；`pg_primary` 段有完整說明）。
    # ⚠️ 兩池的 agent 埠**不准相同**：寫入池吃 25436、讀取池吃 25437。把 25436 複製到這裡
    #    ＝讀取池只認 primary ⇒ 讀取會打到 primary（2026-10-12 修掉的就是這件事）。

# --- Web routing ---------------------------------------------------------
frontend web
    bind *:15153
    default_backend web_nodes

backend web_nodes
    mode http
    # 真實端點是 /api/health（v3/src/server.js）。原本寫的 /api/public/health 不存在 →
    # health check 一律 404，兩個 web 節點會被判定 DOWN。
    option httpchk GET /api/health
    http-check expect status 200
    # 2026-09-23：節點掛掉時，連線失敗要立即改試另一台，而不是在同一個死節點上重試
    # （health check 需要 inter 3s × fall 3 ＝最多約 9 秒才會標記 DOWN）。
    # 只加在 web backend：pg_rw/pg_ro 不加，避免把寫入轉到唯讀的 standby。
    option redispatch
    # redispatch 只救「連線失敗」；節點在回應途中死掉會回 503（2026-09-23 演練實測：停掉 web-A 的
    # 瞬間有 1 次 503）。retry-on 讓這種情況也改試另一台。
    retry-on conn-failure empty-response response-timeout
    # 15153 是各主機「已發佈」的 web 埠（容器內的 5153 只在該主機本機可見），
    # 跨主機的 HAProxy 必須連 15153；連 5153 會 connection refused → 節點 DOWN。
    #
    # 訪客黏滯（Owner 2026-10-10 核准；2026-10-12 由 NAS 上的現行設定逐字同步回本檔）：
    # stick-table 以 `cf-connecting-ip`（Cloudflare 帶進來的真實來源 IP）為鍵，**不是** TCP 來源，
    # 所以來源 IP 相同就會回到同一台（len 45 是 IPv6 的最大長度）。
    # ⚠️ 這兩行在加 weight 之前就已在正式機上運行，**不是**新增的功能；沒有同步回本檔的話，
    #    下次「用本檔 reload」會靜默丟掉它（語法合法、不報錯，只是黏滯消失）。
    stick-table type string len 45 size 100k expire 30m
    stick on req.hdr(cf-connecting-ip) if { req.hdr(cf-connecting-ip) -m found }
    #
    # --- 2026-10-12：新進流量加權（web-a 30 ／ web-b 70）-------------------------------
    # (a) 為什麼刻意不做 50/50：這不是容錯而是效能取捨。兩台跑同一版程式、打同一個 PG（primary
    #     在 casa-nas），差距來自**同一台 casa 的 CPU 被別的工作搶走**——`591-tracker-v3` 34.9%、
    #     `5151-postgres-A` 約 46%、`5151-web-A` 27.6%，4 核 Celeron（N3450）loadavg 約 4.0。
    #     2026-10-12 02:26–02:28 用同一支腳本、同一分鐘、先 B 後 A 實測端對端中位：
    #     web-B = **3,915ms** ／ web-A = **5,240ms**（`list;dur` 1,141–1,662 vs 1,731–2,408ms；
    #     `stats;dur` 2,456–3,337 vs 3,056–3,807ms），差約 25%。維持 roundrobin 等於讓約一半的
    #     新訪客去打慢的那台，中位數被拉高；公網入口當時量到 5,379ms。
    #     副作用（要誠實記）：web-a 分到的新黏滯變少，公開入口在**漸進期**仍可能落到 web-A，
    #     p50 要到黏滯過期才收斂；weight 只是一個相對值，30:70 期望上是新黏滯的 30%／70%。
    # (b) 黏滯（stick-table 30 分鐘）與 weight 的關係：weight 只在**首次**收到請求、該來源 IP
    #     還沒有條目時決定去哪裡。**已經在表內的來源 IP 仍會回到原本那台**，所以效果是**漸進**的
    #     ——30 分鐘內回訪的訪客不會因為這次改動被搬家，新流量才受影響；數字不會立刻整批移轉。
    # (c) web-a 仍保留 30 是**刻意**的，不是忘了歸零：casa-nas 同時是 PG primary（`5151-postgres-A`）
    #     的宿主與 web 層的 failover 目標。歸零等於把 web-A 從候選名單移除，`option redispatch`／
    #     health check 就沒有熱的 web 節點可接（只剩 web-B，它一掛就沒有第二台）。30 同時保留
    #     熱節點與壓測訊號，也讓以後要再做一次 failover 演練時有真實流量可量。
    server web-a 192.168.0.140:15153 check inter 3s fall 3 rise 2 weight 30
    server web-b 192.168.0.220:15153 check inter 3s fall 3 rise 2 weight 70

# --- 有限 stats（Owner 2026-10-10 核准的「最小可信 HA 集」）---------------
# ⚠️ 容器內一定要 `bind :8404`（全介面）：寫 `127.0.0.1:8404` 會因為 Docker 埠轉發進不去而連不上。
# 對外只靠 compose 把宿主埠綁在 loopback（`127.0.0.1:25154:8404`）——**不對公網開放**，也不給 admin。
# 查：`curl -s http://127.0.0.1:25154/stats;csv`，或 `echo "show stat" | nc -q1 127.0.0.1 25154`。
listen internal_stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 15s
    stats show-legends
    stats admin if FALSE

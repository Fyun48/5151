name: 5151-gitea

# Gitea engineering plane (Synology). gitea + PostgreSQL + CI runner.
# 2026-09-20：Gitea 1.22 → 1.27.3（1.22 內建的 act parser 會把含 workflow_dispatch.inputs
# 的 workflow 判成 invalid 而整個忽略，見 evidence/runtime-modernization/GITEA-MIGRATION.md §2.6）。
# 本檔已對齊 NAS 上的實際部署（`~/gitea/docker-compose.yml`）：runner 用 host docker socket
# + `runner-config.yaml`（早先的 DinD 版本並未在正式站啟用）。
services:
  gitea:
    container_name: gitea
    image: gitea/gitea:1.27.3
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?set GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3000/}
      GITEA__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:5251:3000"
      - "127.0.0.1:2222:22"
    volumes:
      - gitea-data:/data
    depends_on:
      - gitea-db

  gitea-db:
    container_name: gitea-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:?set GITEA_DB_PASSWORD}
      POSTGRES_DB: gitea
    volumes:
      - gitea-db:/var/lib/postgresql/data

  # CI runner（對齊正式站）：host docker socket + runner-config.yaml。
  gitea-runner-ci:
    container_name: gitea-runner-ci
    image: gitea/act_runner:latest
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:?set GITEA_RUNNER_TOKEN}
      CONFIG_FILE: /data/config.yaml
    volumes:
      - gitea-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-config.yaml:/data/config.yaml:ro
    depends_on:
      - gitea

volumes:
  gitea-data:
  gitea-db:
  gitea-runner:

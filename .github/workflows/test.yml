name: Tests

on:
  push:
    branches:
      - master
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# ============================================================
# CI SECURITY INVARIANT
#
# Tests 只負責：
# - Checkout
# - Test
# - Build / validation（未來需要時）
#
# Tests 永遠不得：
# - Merge PR
# - 寫入 PR
# - Dispatch Production workflow
# - Deploy Production
# ============================================================

permissions:
  contents: read

# 同一個 PR / branch 出現新 commit，
# 取消舊 HEAD 的 Tests。
#
# 新 HEAD 必須重新取得 PASS，
# 不允許舊 SHA 的 PASS 被新 SHA 沿用。
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test

    runs-on: ubuntu-latest

    # Ops / full test suite 可能較久。
    timeout-minutes: 15

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # --------------------------------------------------------
      # Node
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      # --------------------------------------------------------
      # Tests
      #
      # 暫時維持你目前 CI 的測試語意。
      # Dependency installation 若之後需要調整，
      # 另外獨立 PR，不跟治理修正混在一起。
      # --------------------------------------------------------
      - name: Run Test Suite
        shell: bash
        run: |
          set -euo pipefail

          echo "[Tests] Starting npm test..."
          npm test
          echo "[Tests] npm test completed successfully."

      # --------------------------------------------------------
      # PASS evidence
      # --------------------------------------------------------
      - name: Tests Passed
        shell: bash
        run: |
          echo "✅ Tests PASSED."
          echo "This workflow performed no merge."
          echo "This workflow performed no Production deployment."

name: cf-ssh-bridge
description: >-
  Prefer a Cloudflare Access TCP bridge for NAS SSH/scp, and fall back to the
  public SSH endpoint when the bridge is unavailable. Emits `host` / `port`
  outputs so callers stay working during the migration away from port forwards.

inputs:
  hostname:
    description: Cloudflare Access hostname (e.g. ssh-casa.reversalplay.me)
    required: true
  port:
    description: Local TCP port to expose the bridge on
    required: false
    default: "2222"
  client-id:
    description: Access Service Token client id
    required: true
  client-secret:
    description: Access Service Token client secret
    required: true
  fallback-host:
    description: Public SSH host used only when the bridge cannot be established
    required: false
    default: ""
  fallback-port:
    description: Public SSH port used only when the bridge cannot be established
    required: false
    default: "22"
  ssh-user:
    description: Optional SSH user for the end-to-end smoke test
    required: false
    default: ""
  ssh-key:
    description: Optional SSH private key for the end-to-end smoke test
    required: false
    default: ""
  cloudflared-url:
    description: Download URL for the cloudflared linux-amd64 binary
    required: false
    default: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

outputs:
  host:
    description: Host that callers should SSH to
    value: ${{ steps.bridge.outputs.host }}
  port:
    description: Port that callers should SSH to
    value: ${{ steps.bridge.outputs.port }}
  mode:
    description: '`cloudflare` when the bridge is up, `public-fallback` otherwise'
    value: ${{ steps.bridge.outputs.mode }}
  docker_host:
    description: >-
      Host to use from Docker-based actions (e.g. appleboy/scp-action runs inside
      a container, where 127.0.0.1 is the container itself). Equals the Docker
      bridge gateway while the tunnel is up, otherwise the public fallback host.
    value: ${{ steps.bridge.outputs.docker_host }}

runs:
  using: composite
  steps:
    - name: Resolve NAS SSH endpoint
      id: bridge
      shell: bash
      env:
        CF_HOST: ${{ inputs.hostname }}
        CF_PORT: ${{ inputs.port }}
        CF_ID: ${{ inputs.client-id }}
        CF_SECRET: ${{ inputs.client-secret }}
        CF_URL: ${{ inputs.cloudflared-url }}
        CF_FALLBACK_HOST: ${{ inputs.fallback-host }}
        CF_FALLBACK_PORT: ${{ inputs.fallback-port }}
        CF_SSH_USER: ${{ inputs.ssh-user }}
        CF_SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        set -uo pipefail

        fallback() {
          if [ -z "${CF_FALLBACK_HOST}" ]; then
            echo "::error::cf-ssh-bridge unusable: ${1} and no fallback host configured"
            exit 1
          fi
          echo "::warning::cf-ssh-bridge falling back to public SSH ${CF_FALLBACK_HOST}:${CF_FALLBACK_PORT} (${1})"
          echo "mode=public-fallback" >> "$GITHUB_OUTPUT"
          echo "host=${CF_FALLBACK_HOST}" >> "$GITHUB_OUTPUT"
          echo "docker_host=${CF_FALLBACK_HOST}" >> "$GITHUB_OUTPUT"
          echo "port=${CF_FALLBACK_PORT}" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if ! command -v cloudflared >/dev/null 2>&1; then
          if ! curl -fsSL -o /tmp/cloudflared "$CF_URL"; then
            fallback "cloudflared download failed"
          fi
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared || fallback "cloudflared install failed"
        fi
        cloudflared --version || fallback "cloudflared not runnable"

        DOCKER_GW="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)"
        if [ -z "$DOCKER_GW" ]; then DOCKER_GW="172.17.0.1"; fi

        # Bind on all interfaces: container-based actions reach the runner through the
        # Docker bridge gateway, not through loopback.
        nohup cloudflared access tcp \
          --protocol http2 \
          --hostname "$CF_HOST" \
          --service-token-id "$CF_ID" \
          --service-token-secret "$CF_SECRET" \
          --url "0.0.0.0:$CF_PORT" \
          > /tmp/cf-ssh-bridge.log 2>&1 &

        ready=0
        for _ in $(seq 1 30); do
          if (exec 3<>/dev/tcp/127.0.0.1/"$CF_PORT") 2>/dev/null && \
             (exec 3<>/dev/tcp/"$DOCKER_GW"/"$CF_PORT") 2>/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done

        if [ "$ready" = 1 ]; then
          # A listening socket is not proof that the data path works: probe end to end
          # with a bounded SSH command so a stalled tunnel falls back instead of hanging.
          if [ -n "${CF_SSH_USER:-}" ] && [ -n "${CF_SSH_KEY:-}" ]; then
            keyfile="$(mktemp)"
            printf '%s\n' "$CF_SSH_KEY" > "$keyfile"
            chmod 600 "$keyfile"
            if timeout 90 ssh -p "$CF_PORT" -i "$keyfile" \
                 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectTimeout=20 \
                 "${CF_SSH_USER}@127.0.0.1" 'echo bridge-ssh-ok' > /tmp/cf-ssh-smoke.log 2>&1 \
               && grep -q bridge-ssh-ok /tmp/cf-ssh-smoke.log; then
              echo "cf-ssh-bridge: SSH smoke test OK (${CF_SSH_USER}@127.0.0.1:${CF_PORT})"
            else
              echo "cf-ssh-bridge: smoke test output follows"; tail -5 /tmp/cf-ssh-smoke.log || true
              rm -f "$keyfile"
              fallback "bridge SSH smoke test failed or timed out"
            fi
            rm -f "$keyfile"
          else
            echo "cf-ssh-bridge: smoke test skipped (ssh-user/ssh-key not provided)"
          fi

          echo "cf-ssh-bridge: ${CF_HOST} -> 127.0.0.1:${CF_PORT} / docker ${DOCKER_GW}:${CF_PORT} ready"
          echo "mode=cloudflare" >> "$GITHUB_OUTPUT"
          echo "host=127.0.0.1" >> "$GITHUB_OUTPUT"
          echo "docker_host=${DOCKER_GW}" >> "$GITHUB_OUTPUT"
          echo "port=${CF_PORT}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        cat /tmp/cf-ssh-bridge.log || true
        fallback "bridge never listened on 127.0.0.1:${CF_PORT}"


# 5151 Shadow HA — HAProxy template (Phase 15)
# Listens（container ports；host 對應見 docker-compose.yml）:
#   25433  postgres-rw   (only the current primary)
#   25434  postgres-ro   (standby first, primary fallback)
#   15153  web           (round-robin Web-A / Web-B；host 發佈為 25153)
#
# `${CASAOS_HOST}` / `${SYNOLOGY_HOST}` 由 **容器啟動時** sed 展開（見 render-and-run.sh）：
# docker compose 只會替換 compose YAML 內的 ${...}，**不會**替換掛載檔案的內容，
# 所以本檔以 .tmpl 掛載，展開後才交給 haproxy。
# Health checks must distinguish primary / standby / web; the router must NOT
# promote PostgreSQL itself (promotion is manual — see the failover runbook).

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 2

# --- PostgreSQL routing -------------------------------------------------
# Native PostgreSQL auth check proves the server accepts connections. For
# primary/standby role separation, `postgres-rw` points only at the primary
# and `postgres-ro` prefers the standby. On a manual failover the runbook
# re-points these backends; the application DB router additionally verifies
# pg_is_in_recovery() for read-after-write safety.

frontend pg_rw
    bind *:25433
    default_backend pg_primary

frontend pg_ro
    bind *:25434
    default_backend pg_standby_first

backend pg_primary
    option pgsql-check user postgres
    # 預設 primary = CasaOS（5151-postgres-A）；Synology 自 2026-10-09 起為 standby。
    # 兩個節點都活著時，pg-rw 會照這裡的順序走 —— promote 後一定要同步這份設定並 reload，
    # 否則寫入會被導到已降級成唯讀的節點（實測 pg_is_in_recovery() 會回 t）。
    server pg-a ${CASAOS_HOST}:15432 check inter 3s fall 3 rise 2
    server pg-b ${SYNOLOGY_HOST}:15432 check inter 3s fall 3 rise 2 backup

    # --- 角色感知的 agent-check 範例（尚未啟用；HAProxy 2.9.15 實測可用語法）---
    # `option pgsql-check` 只驗「能連線、能通過 auth」，不驗 `pg_is_in_recovery()`，
    # 所以上面得靠「手動排順序」保證寫入只到 primary。要改成自動跳過 standby，
    # 就把上面兩行 server 換成下面這種寫法（並在各節點放一個依 `pg_is_in_recovery()`
    # 回覆 ready/down 的 agent-check responder）：
    #     balance first
    #     server pg-a ${CASAOS_HOST}:15432 check inter 3s fall 3 rise 2 agent-check agent-port 25436 agent-inter 2s
    #     server pg-b ${SYNOLOGY_HOST}:15432 check inter 3s fall 3 rise 2 agent-check agent-port 25436 agent-inter 2s
    # 語法限制（2.9.15 實測）：
    #   * server 行的關鍵字是 `agent-check agent-port <port> agent-inter <n>s`。
    #   * **沒有** `agent-fall`／`agent-rise`，也**沒有** backend 級 `option agent-check`
    #     （兩者實測都報 unknown keyword／unknown option）。
    #   * `agent-check` 沒有防抖 ⇒ 波動抑制要放在 responder 端。
    #   * 全部 server 的 agent 都回 down 時，`balance first` 會沒有任何可用後端、
    #     連線直接失敗（fail-closed，不會把寫入送到 standby）。
    #   * `25434` 已被 `frontend pg_ro` 占用，故 agent 埠用 25436（primary 埠）／25437（standby 埠）。

backend pg_standby_first
    option pgsql-check user postgres
    # 讀取端點 pg-ro 維持 pg-a 優先、pg-b 備援（2026-10-09 對調後 pg-a=primary；此 block 未隨對調改動）。
    server pg-a ${CASAOS_HOST}:15432 check inter 3s fall 3 rise 2
    server pg-b ${SYNOLOGY_HOST}:15432 check inter 3s fall 3 rise 2 backup

# --- Web routing ---------------------------------------------------------
frontend web
    bind *:15153
    default_backend web_nodes

backend web_nodes
    mode http
    # 真實端點是 /api/health（v3/src/server.js）。原本寫的 /api/public/health 不存在 →
    # health check 一律 404，兩個 web 節點會被判定 DOWN。
    option httpchk GET /api/health
    http-check expect status 200
    # 2026-09-23：節點掛掉時，連線失敗要立即改試另一台，而不是在同一個死節點上重試
    # （health check 需要 inter 3s × fall 3 ＝最多約 9 秒才會標記 DOWN）。
    # 只加在 web backend：pg_rw/pg_ro 不加，避免把寫入轉到唯讀的 standby。
    option redispatch
    # redispatch 只救「連線失敗」；節點在回應途中死掉會回 503（2026-09-23 演練實測：停掉 web-A 的
    # 瞬間有 1 次 503）。retry-on 讓這種情況也改試另一台。
    retry-on conn-failure empty-response response-timeout
    # 15153 是各主機「已發佈」的 web 埠（容器內的 5153 只在該主機本機可見），
    # 跨主機的 HAProxy 必須連 15153；連 5153 會 connection refused → 節點 DOWN。
    #
    # --- 2026-10-12：新進流量加權（web-a 30 ／ web-b 70）-------------------------------
    # (a) 為什麼刻意不做 50/50：這不是容錯而是效能取捨。兩台跑同一版程式、打同一個 PG（primary
    #     在 casa-nas），差距來自**同一台 casa 的 CPU 被別的工作搶走**——`591-tracker-v3` 34.9%、
    #     `5151-postgres-A` 約 46%、`5151-web-A` 27.6%，4 核 Celeron（N3450）loadavg 約 4.0。
    #     2026-10-12 02:26–02:28 用同一支腳本、同一分鐘、先 B 後 A 實測端對端中位：
    #     web-B = **3,915ms** ／ web-A = **5,240ms**（`list;dur` 1,141–1,662 vs 1,731–2,408ms；
    #     `stats;dur` 2,456–3,337 vs 3,056–3,807ms），差約 25%。維持 roundrobin 等於讓約一半的
    #     新訪客去打慢的那台，中位數被拉高；公網入口當時量到 5,379ms。
    #     副作用（要誠實記）：web-a 分到的新黏滯變少，公開入口在**漸進期**仍可能落到 web-A，
    #     p50 要到黏滯過期才收斂；weight 只是一個相對值，30:70 期望上是新黏滯的 30%／70%。
    # (b) 黏滯（stick-table 30 分鐘）與 weight 的關係：weight 只在**首次**收到請求、該來源 IP
    #     還沒有條目時決定去哪裡。**已經在表內的來源 IP 仍會回到原本那台**，所以效果是**漸進**的
    #     ——30 分鐘內回訪的訪客不會因為這次改動被搬家，新流量才受影響；數字不會立刻整批移轉。
    # (c) web-a 仍保留 30 是**刻意**的，不是忘了歸零：casa-nas 同時是 PG primary（`5151-postgres-A`）
    #     的宿主與 web 層的 failover 目標。歸零等於把 web-A 從候選名單移除，`option redispatch`／
    #     health check 就沒有熱的 web 節點可接（只剩 web-B，它一掛就沒有第二台）。30 同時保留
    #     熱節點與壓測訊號，也讓以後要再做一次 failover 演練時有真實流量可量。
    server web-a ${CASAOS_HOST}:15153 check inter 3s fall 3 rise 2 weight 30
    server web-b ${SYNOLOGY_HOST}:15153 check inter 3s fall 3 rise 2 weight 70

    # 訪客黏滯（Owner 2026-10-10 核准；2026-10-12 由 NAS 上的現行設定逐字同步回本檔）：
    # stick-table 以 `cf-connecting-ip`（Cloudflare 帶進來的真實來源 IP）為鍵，**不是** TCP 來源，
    # 所以來源 IP 相同就會回到同一台（len 45 是 IPv6 的最大長度）。
    # ⚠️ 這兩行在加 weight 之前就已在正式機上運行，**不是**本 PR 新增的功能；沒有同步回本檔的話，
    #    下次「用本檔 reload」會靜默丟掉它（語法合法、不報錯，只是黏滯消失）。
    stick-table type string len 45 size 100k expire 30m
    stick on req.hdr(cf-connecting-ip) if { req.hdr(cf-connecting-ip) -m found }

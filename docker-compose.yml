name: 591-tracker

services:
  591-tracker:
    container_name: 591-tracker
    build: .
    image: 591-tracker:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5151:5151"
    environment:
      HOST: "0.0.0.0"
      PORT: "5151"
      DATA_DIR: /data
      TZ: Asia/Taipei
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/591-tracker:/data

  updater:
    profiles: ["autoupdate"]
    image: alpine:3.20
    container_name: 591-tracker-updater
    restart: unless-stopped
    working_dir: /repo
    environment:
      TZ: Asia/Taipei
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache git docker-cli docker-cli-compose
        git config --global --add safe.directory /repo
        echo "591 updater started"
        while true; do
          BRANCH=$$(git rev-parse --abbrev-ref HEAD)
          if [ "$$BRANCH" = "HEAD" ]; then BRANCH=master; fi
          if git fetch origin "$$BRANCH"; then
            LOCAL=$$(git rev-parse HEAD)
            REMOTE=$$(git rev-parse "origin/$$BRANCH")
            if [ "$$LOCAL" != "$$REMOTE" ]; then
              echo "updating $$BRANCH $$LOCAL -> $$REMOTE"
              git reset --hard "origin/$$BRANCH"
              docker compose --profile tunnel --profile autoupdate up -d --build
            fi
          fi
          sleep 120
        done

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: 591-tracker-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - 591-tracker

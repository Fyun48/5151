name: Stop v1 on CasaOS

on:
  push:
    branches: [master, main]
    paths:
      - "docker-compose.yml"
      - "casaos-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: "docker-compose.yml,casaos-compose.yml"
          target: /mnt/Storage1/apps/5151
          overwrite: true
      - name: Stop v1 container and keep its data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /mnt/Storage1/apps/5151
            docker compose stop 591-tracker || true
            docker stop 591-tracker || true
            docker rm -f 591-tracker || true

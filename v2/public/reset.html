<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>清除資料 · 591 物件追蹤</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Noto Sans TC", "PMingLiU", sans-serif;
      background: #f4f1ea;
      color: #1f1a16;
    }
    .card {
      width: min(480px, calc(100vw - 32px));
      background: #fffdf8;
      border: 1px solid #e6ddd2;
      border-radius: 18px;
      padding: 28px;
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { color: #6d645c; line-height: 1.6; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font: 15px/1 "Noto Sans TC", sans-serif;
      background: #c45c26;
      color: #fff;
    }
    button[disabled] { opacity: 0.5; }
    a { color: #c45c26; }
    .msg { margin-top: 12px; min-height: 1.4em; }
    .site-footer {
      margin: 16px 0 0;
      text-align: center;
      color: #6d645c;
      font-size: 12px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>清除全部追蹤資料</h1>
    <p>畫面一直停在「載入中」、儲存按鈕不能按，通常是網頁程式錯誤，<strong>清資料解不了</strong>。請先回首頁按「重新整理」。</p>
    <p>這裡會刪除物件列表、檢查紀錄、設定檔、通勤與排除範圍。登入帳號密碼不會動。清除後請回首頁重新勾行政區並按「立即檢查」。</p>
    <button type="button" id="btn">確認清除，從頭開始</button>
    <p class="msg" id="msg"></p>
    <p><a href="/">回追蹤首頁</a></p>
    <footer class="site-footer">reversal play tech | 逆遊科技</footer>
  </div>
  <script>
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");
    fetch("/api/me", { cache: "no-store" }).then((r) => r.json()).then((data) => {
      if (!data.ok) location.replace("/login.html");
      if (data.role && data.role !== "admin") {
        btn.disabled = true;
        msg.textContent = "只有管理員可以清除共用資料。";
      }
    }).catch(() => {
      msg.textContent = "連不上伺服器，請稍候再開這個頁面。";
    });
    btn.onclick = async () => {
      if (!window.confirm("確定清除全部物件與設定？此動作不能復原。")) return;
      btn.disabled = true;
      msg.textContent = "清除中…";
      try {
        const res = await fetch("/api/reset-all", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ confirm: true }),
          signal: AbortSignal.timeout(20000),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "清除失敗");
        msg.textContent = "已清除。請回首頁重新設定。";
        location.replace("/?fresh=1");
      } catch (error) {
        msg.textContent = error.message || "清除失敗";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>

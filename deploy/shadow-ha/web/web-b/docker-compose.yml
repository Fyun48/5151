name: 5151-shadow-web-b

# Web-B (Synology) + cloudflared-B connector. Identical to Web-A except host.
services:
  5151-web-B:
    container_name: 5151-web-B
    image: ghcr.io/fyun48/5151:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:15153:5153"
    environment:
      HOST: "0.0.0.0"
      PORT: "5153"
      APP_ROLE: "web"
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?shared across web nodes}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      TZ: Asia/Taipei
    volumes:
      - ${V3_DATA_ROOT}:/data
    command: ["node", "src/server.js"]

  5151-cloudflared-B:
    container_name: 5151-cloudflared-B
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - 5151-web-B

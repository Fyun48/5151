name: Production predeploy check (no deploy)
run-name: "${{ inputs.release_mode == 'ops_phase15' && format('phase15-intent:{0}', inputs.release_intent_id) || format('manual-owner:{0}', inputs.sha) }}"

# 使用既有 Production NAS secrets：檢查現行 v3、做已驗證備份、Wish Room 唯讀預檢。
# 不是部署：不 SCP 應用程式、不 pull image、不改 image、不 compose up 新版、不跑應用 schema migration。
#
# 備份位置（Issue #355）：備份根目錄由 remote script 的 PREDEPLOY_BACKUP_ROOT 決定，預設是 live
# 資料卷旁的同層目錄；本 workflow 明確指向另一顆儲存池 /mnt/Storage1/docker_data/591-tracker-v3-backups，
# 避免備份與 live v3.db 競爭同一個 /DATA 卷（先前就是這樣把資料卷塞滿的）。
# Host 端工作目錄（helpers / work dir / evidence）同樣放在 /mnt/Storage1/docker_data
# （PREDEPLOY_WORK_ROOT），因此系統卷或 /DATA 滿載時 predeploy 仍能完成。
# 備份保留：remote script 會在寫入新備份「之前」先修剪較舊的 predeploy-* 備份，只保留最新
# PREDEPLOY_BACKUP_KEEP 份（預設 2）。這讓資料卷滿載時，同一次 run 能先釋放空間再建立備份，
# 而不是以 no space left on device 失敗；也避免備份無上限累積。
#
# release_mode=manual_owner：人工治理路徑，不依賴 Ops Phase 15 / release_intent_id。
# release_mode=ops_phase15：維持既有 Phase 15 綁定（run-name phase15-intent:<id>）。
#
# 已核對的最後一次成功 v3 Production source（deploy-v3.yml run 34113624372, 2026-09-07T10:51:37Z）：
#   584d583e56151abcf01c972b7bb45a82c73e4596
#   = GitHub PR #191 merge commit（gh pr view 191 / git cat-file）
# 無效 SHA 584d583e56151abcf01c972b7bb45e4596 不是 Git object，禁止當作 rollback。
# Owner 已書面授權：Cursor Agent（actor `cursor` / `cursor[bot]`）在使用者要求合併部署時
# 可從 master 觸發本檔；見 AGENTS.md 與 .cursor/rules/owner-merge-deploy.mdc。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "即將評估的完整 40 碼 source SHA（必須可從 origin/master 追溯；本 workflow 不會部署它）"
        required: true
      confirmation:
        description: "輸入 PREDEPLOY-PRODUCTION 以確認只做檢查與備份"
        required: true
        default: ""
      release_mode:
        description: "Release path: manual_owner（人工治理，預設）或 ops_phase15（Ops Phase 15 綁定）"
        type: choice
        required: true
        default: manual_owner
        options:
          - manual_owner
          - ops_phase15
      release_intent_id:
        description: "僅 ops_phase15 必填：Ops Phase 15 durable release_intent_id。manual_owner 必須空白；非空會 fail-closed（避免舊 Phase 15 caller 被降成 Manual Owner）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect-and-backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Authorize production predeploy check (fail-closed)
        env:
          WF_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRM: ${{ inputs.confirmation }}
          CHECK_SHA: ${{ inputs.sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
        run: |
          set -euo pipefail
          if [ "$WF_REF" != "refs/heads/master" ]; then
            echo "::error::Predeploy check must run from the master workflow definition (got $WF_REF)"; exit 1
          fi
          if [ -z "${ALLOWED_ACTOR:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_ALLOWED_ACTOR is not configured; refusing (fail-closed)"; exit 1
          fi
          CURSOR_DEPLOY=0
          if [ "$ACTOR" = "cursor" ] || [ "$ACTOR" = "cursor[bot]" ]; then
            if [ "$TRIGGERING_ACTOR" = "cursor" ] || [ "$TRIGGERING_ACTOR" = "cursor[bot]" ]; then
              CURSOR_DEPLOY=1
            fi
          fi
          if [ "$CURSOR_DEPLOY" != 1 ] && [ "$ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::actor '$ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "$CURSOR_DEPLOY" != 1 ] && [ "$TRIGGERING_ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::triggering actor '$TRIGGERING_ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "${CONFIRM:-}" != "PREDEPLOY-PRODUCTION" ]; then
            echo "::error::confirmation must be exactly PREDEPLOY-PRODUCTION"; exit 1
          fi
          if ! printf '%s' "${CHECK_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
          if [ "${RELEASE_MODE:-}" != "manual_owner" ] && [ "${RELEASE_MODE:-}" != "ops_phase15" ]; then
            echo "::error::release_mode must be manual_owner or ops_phase15 (got '${RELEASE_MODE:-}')"; exit 1
          fi
          if [ "${RELEASE_MODE:-}" = "ops_phase15" ] && [ -z "${RELEASE_INTENT_ID:-}" ]; then
            echo "::error::ops_phase15 requires a non-empty release_intent_id"; exit 1
          fi
          if [ "${RELEASE_MODE:-}" = "manual_owner" ] && [ -n "${RELEASE_INTENT_ID:-}" ]; then
            echo "::error::manual_owner forbids a non-empty release_intent_id; stale Phase 15 callers must set release_mode=ops_phase15"; exit 1
          fi
      - name: Checkout workflow-definition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify trusted workflow-definition SHA
        env:
          EXPECTED_WF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Helpers and evidence writers must come from this exact workflow-definition
          # commit (github.sha), not a moving master tip that advanced after dispatch.
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$EXPECTED_WF_SHA" ]; then
            echo "::error::trusted checkout HEAD $HEAD_SHA != workflow execution SHA $EXPECTED_WF_SHA"; exit 1
          fi
      - name: Write Phase 15 run identity
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        env:
          EVIDENCE_KIND: identity
          WF_FILE: .github/workflows/production-predeploy-check.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 .github/scripts/write-phase15-workflow-evidence.py phase15-run-identity.json
      - name: Upload Phase 15 run identity
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase15-run-identity
          path: phase15-run-identity.json
          if-no-files-found: error
      - name: Write Manual Owner run identity
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        env:
          EVIDENCE_KIND: identity
          RELEASE_MODE: manual_owner
          WF_FILE: .github/workflows/production-predeploy-check.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 .github/scripts/write-manual-owner-workflow-evidence.py manual-owner-run-identity.json
      - name: Upload Manual Owner run identity
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-owner-run-identity
          path: manual-owner-run-identity.json
          if-no-files-found: error
      - name: Validate SHA reachable from origin/master (no checkout of that SHA onto NAS)
        env:
          CHECK_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$CHECK_SHA" origin/master; then
            echo "::error::commit $CHECK_SHA is not reachable from origin/master; refusing"; exit 1
          fi
          echo "Evaluated source SHA $CHECK_SHA is on origin/master ancestry (not deployed by this job)."
      - name: NAS SSH endpoint (Cloudflare Access bridge only; no public fallback)
        id: cf-bridge
        uses: ./.github/actions/cf-ssh-bridge
        with:
          hostname: ssh-casa.reversalplay.me
          port: "2222"
          client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ssh-user: ${{ secrets.NAS_USER }}
          ssh-key: ${{ secrets.NAS_SSH_KEY }}
      - name: Copy inspect/backup helpers to NAS (Storage1 pool)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cf-bridge.outputs.docker_host }}
          port: ${{ steps.cf-bridge.outputs.port }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: ".github/scripts/production-predeploy-remote.sh,.github/scripts/verify-sqlite-integrity-json.py,.github/scripts/sqlite-readonly-inspect.mjs,.github/scripts/sqlite-online-backup.mjs,.github/scripts/sqlite-online-backup.py"
          target: /mnt/Storage1/docker_data/5151-predeploy-helpers
          overwrite: true
      - name: Inspect Production v3, backup, read-only Wish Room
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.cf-bridge.outputs.host }}
          port: ${{ steps.cf-bridge.outputs.port }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script_stop: true
          # Live v3.db online backup can exceed appleboy's default 10m; job timeout-minutes stays 30.
          command_timeout: 20m
          script: |
            set -euo pipefail
            # 不 docker compose up、不 pull、不重啟成新版、不印 secrets。
            # Issue #355: keep every host-side write on the Storage1 pool, not on the live data volume.
            export PREDEPLOY_BACKUP_ROOT=/mnt/Storage1/docker_data/591-tracker-v3-backups
            export PREDEPLOY_WORK_ROOT=/mnt/Storage1/docker_data
            export INSPECT_SCRIPT=/mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/sqlite-readonly-inspect.mjs
            export BACKUP_SCRIPT=/mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/sqlite-online-backup.mjs
            export BACKUP_PY_SCRIPT=/mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/sqlite-online-backup.py
            chmod +x /mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/production-predeploy-remote.sh
            /mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/production-predeploy-remote.sh
            rm -f /mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/sqlite-readonly-inspect.mjs \
                  /mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/sqlite-online-backup.mjs \
                  /mnt/Storage1/docker_data/5151-predeploy-helpers/.github/scripts/sqlite-online-backup.py
      - name: Synology NAS SSH endpoint (Cloudflare Access bridge only)
        id: cf-tori-bridge
        uses: ./.github/actions/cf-ssh-bridge
        with:
          hostname: ssh-tori.reversalplay.me
          port: "2223"
          client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ssh-user: ${{ secrets.V3_SYNOLOGY_USER }}
          ssh-key: ${{ secrets.V3_SYNOLOGY_SSH_KEY }}
      - name: Probe PostgreSQL primary role on both NAS (role-aware, no deploy)
        id: pg-role-probe
        env:
          NAS_HOST: ${{ steps.cf-bridge.outputs.host }}
          NAS_PORT: ${{ steps.cf-bridge.outputs.port }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          TORI_HOST: ${{ steps.cf-tori-bridge.outputs.host }}
          TORI_PORT: ${{ steps.cf-tori-bridge.outputs.port }}
          TORI_USER: ${{ secrets.V3_SYNOLOGY_USER }}
          TORI_SSH_KEY: ${{ secrets.V3_SYNOLOGY_SSH_KEY }}
          PROBE_SCRIPT: deploy/shadow-ha/predeploy-primary-probe.sh
          CASA_LAN_IP: "192.168.0.140"
          SYN_LAN_IP: "192.168.0.220"
          CASA_PG_CONTAINER: "5151-postgres-A"
          SYN_PG_CONTAINER: "5151-postgres-B"
        run: |
          set -euo pipefail
          # 段一（探測，兩台都做、唯讀）：各自在「本機」判定角色——
          #   oracle 1 = agent 埠 25436（up=primary）；oracle 2 = 本機 PG pg_is_in_recovery()（f=primary）。
          # 兩個 oracle 必須一致（fail-closed）。注意：25433 已被 HAProxy 改成 role-aware
          # （任何一台都導到当下的 primary），所以不能用 25433 判角色，否則兩台都回 f 誤判腦裂。
          # probe 腳本經 ssh stdin 跑，不落地到 NAS、不印密碼／連線字串。
          casa_out="$(mktemp)"; syn_out="$(mktemp)"
          trap 'rm -f "$casa_out" "$syn_out"' EXIT

          run_probe() {
            host="$1"; port="$2"; user="$3"; key="$4"; role="$5"; lan_ip="$6"; container="$7"; out="$8"
            kf="$(mktemp)"
            printf '%s\n' "$key" > "$kf"
            chmod 600 "$kf"
            if ! ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p "$port" -i "$kf" \
                "$user@$host" \
                "HOST_ROLE=$role PG_CONTAINER=$container LAN_IP=$lan_ip bash -s" \
                < "$PROBE_SCRIPT" > "$out" 2>&1; then
              echo "::error::role probe on $role failed; remote output:" >&2
              cat "$out" >&2
              rm -f "$kf"
              return 1
            fi
            rm -f "$kf"
          }

          run_probe "$NAS_HOST" "$NAS_PORT" "$NAS_USER" "$NAS_SSH_KEY" casa "$CASA_LAN_IP" "$CASA_PG_CONTAINER" "$casa_out"
          run_probe "$TORI_HOST" "$TORI_PORT" "$TORI_USER" "$TORI_SSH_KEY" syn "$SYN_LAN_IP" "$SYN_PG_CONTAINER" "$syn_out"

          casa_line="$(grep '^ROLE_PROBE_OK ' "$casa_out" | tail -n1)"
          syn_line="$(grep '^ROLE_PROBE_OK ' "$syn_out" | tail -n1)"
          [ -n "$casa_line" ] || { echo "::error::casa probe produced no ROLE_PROBE_OK line"; cat "$casa_out" >&2; exit 1; }
          [ -n "$syn_line" ] || { echo "::error::syn probe produced no ROLE_PROBE_OK line"; cat "$syn_out" >&2; exit 1; }

          casa_verdict="$(printf '%s' "$casa_line" | grep -o 'verdict=[a-z]*' | cut -d= -f2)"
          syn_verdict="$(printf '%s' "$syn_line" | grep -o 'verdict=[a-z]*' | cut -d= -f2)"
          casa_agent="$(printf '%s' "$casa_line" | grep -o 'agent=[a-z]*' | cut -d= -f2)"
          syn_agent="$(printf '%s' "$syn_line" | grep -o 'agent=[a-z]*' | cut -d= -f2)"
          casa_recovery="$(printf '%s' "$casa_line" | grep -o 'recovery=[a-z]*' | cut -d= -f2)"
          syn_recovery="$(printf '%s' "$syn_line" | grep -o 'recovery=[a-z]*' | cut -d= -f2)"

          echo "role probe: casa verdict=$casa_verdict agent=$casa_agent recovery=$casa_recovery; syn verdict=$syn_verdict agent=$syn_agent recovery=$syn_recovery"

          if [ "$casa_verdict" = primary ] && [ "$syn_verdict" = standby ]; then
            SELECTED_ROLE=casa; SELECTED_CONTAINER="$CASA_PG_CONTAINER"
          elif [ "$casa_verdict" = standby ] && [ "$syn_verdict" = primary ]; then
            SELECTED_ROLE=syn; SELECTED_CONTAINER="$SYN_PG_CONTAINER"
          elif [ "$casa_verdict" = primary ] && [ "$syn_verdict" = primary ]; then
            echo "::error::split-brain: both casa and syn report primary; refusing to back up"; exit 1
          elif [ "$casa_verdict" = standby ] && [ "$syn_verdict" = standby ]; then
            echo "::error::no primary: both casa and syn report standby; refusing to back up"; exit 1
          else
            echo "::error::could not resolve PG primary (casa=$casa_verdict syn=$syn_verdict)"; exit 1
          fi

          echo "host_role=$SELECTED_ROLE" >> "$GITHUB_OUTPUT"
          echo "pg_container=$SELECTED_CONTAINER" >> "$GITHUB_OUTPUT"

          # 段一結果落成 evidence（純觀測、無密碼）。
          printf '%s\n' "{\"schema\":\"pg-role-probe-v1\",\"selected_primary\":\"$SELECTED_ROLE\",\"selected_container\":\"$SELECTED_CONTAINER\",\"casa\":{\"verdict\":\"$casa_verdict\",\"agent\":\"$casa_agent\",\"recovery\":\"$casa_recovery\"},\"syn\":{\"verdict\":\"$syn_verdict\",\"agent\":\"$syn_agent\",\"recovery\":\"$syn_recovery\"}}" > pg-role-probe-evidence.json
      - name: PostgreSQL backup from current primary (role-aware, no deploy)
        env:
          NAS_HOST: ${{ steps.cf-bridge.outputs.host }}
          NAS_PORT: ${{ steps.cf-bridge.outputs.port }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          TORI_HOST: ${{ steps.cf-tori-bridge.outputs.host }}
          TORI_PORT: ${{ steps.cf-tori-bridge.outputs.port }}
          TORI_USER: ${{ secrets.V3_SYNOLOGY_USER }}
          TORI_SSH_KEY: ${{ secrets.V3_SYNOLOGY_SSH_KEY }}
          SELECTED_ROLE: ${{ steps.pg-role-probe.outputs.host_role }}
          SELECTED_CONTAINER: ${{ steps.pg-role-probe.outputs.pg_container }}
          PG_HELPER: .github/scripts/production-predeploy-pg-remote.sh
          PG_DB: 5151_shadow
          CASA_BACKUP_DIR: /mnt/Storage1/docker_data/5151-pg-backups
          SYN_BACKUP_DIR: /var/services/homes/tori/backups/5151
        run: |
          set -euo pipefail
          # 段二（備份）：只在段一選出的 primary 那台跑 pg_dump。
          case "$SELECTED_ROLE" in
            casa)
              HOST="$NAS_HOST"; PORT="$NAS_PORT"; USER="$NAS_USER"; KEY="$NAS_SSH_KEY"
              BACKUP_DIR="$CASA_BACKUP_DIR"
              REMOTE_HELPER="/mnt/Storage1/docker_data/5151-predeploy-pg-helpers/.github/scripts/production-predeploy-pg-remote.sh"
              ;;
            syn)
              HOST="$TORI_HOST"; PORT="$TORI_PORT"; USER="$TORI_USER"; KEY="$TORI_SSH_KEY"
              BACKUP_DIR="$SYN_BACKUP_DIR"
              REMOTE_HELPER="/var/services/homes/tori/5151-predeploy-pg-helpers/.github/scripts/production-predeploy-pg-remote.sh"
              ;;
            *)
              echo "::error::unknown selected primary role '$SELECTED_ROLE'"; exit 1 ;;
          esac

          kf="$(mktemp)"
          printf '%s\n' "$KEY" > "$kf"
          chmod 600 "$kf"
          trap 'rm -f "$kf"' EXIT

          # 把 pg backup helper scp 到「選中的 primary」主機（沿用既有 docker exec + unix socket 方式）。
          REMOTE_HELPER_DIR="$(dirname "$REMOTE_HELPER")"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p "$PORT" -i "$kf" "$USER@$HOST" \
            "mkdir -p '$REMOTE_HELPER_DIR'"
          scp -o StrictHostKeyChecking=accept-new -P "$PORT" -i "$kf" \
            "$PG_HELPER" "$USER@$HOST:$REMOTE_HELPER"

          # 在選中的 primary 本機 docker exec pg_dump（unix socket trust，不帶密碼）。
          # command_timeout 由下方 timeout 對齊既有的 20m；job timeout-minutes 仍是 30。
          timeout 20m ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p "$PORT" -i "$kf" "$USER@$HOST" \
            "PREDEPLOY_PG_CONTAINER='$SELECTED_CONTAINER' PREDEPLOY_PG_DB='$PG_DB' PREDEPLOY_PG_BACKUP_DIR='$BACKUP_DIR' bash '$REMOTE_HELPER'"
      - name: Pull NAS predeploy evidence
        env:
          NAS_HOST: ${{ steps.cf-bridge.outputs.host }}
          NAS_PORT: ${{ steps.cf-bridge.outputs.port }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          TORI_HOST: ${{ steps.cf-tori-bridge.outputs.host }}
          TORI_PORT: ${{ steps.cf-tori-bridge.outputs.port }}
          TORI_USER: ${{ secrets.V3_SYNOLOGY_USER }}
          TORI_SSH_KEY: ${{ secrets.V3_SYNOLOGY_SSH_KEY }}
          PG_ROLE: ${{ steps.pg-role-probe.outputs.host_role }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s\n' "$NAS_SSH_KEY" > "$key"
          chmod 600 "$key"
          scp -o StrictHostKeyChecking=accept-new -P "$NAS_PORT" -i "$key" \
            "$NAS_USER@$NAS_HOST:/mnt/Storage1/docker_data/phase15-predeploy-evidence.json" ./nas-predeploy-evidence.json
          rm -f "$key"
          # pg 證據檔在「段一選出的 primary」那台，依 PG_ROLE 決定從哪台拉。
          case "$PG_ROLE" in
            casa)
              pg_host="$NAS_HOST"; pg_port="$NAS_PORT"; pg_user="$NAS_USER"; pg_key="$NAS_SSH_KEY"
              pg_evidence_path="/mnt/Storage1/docker_data/5151-pg-backups/pg-predeploy-evidence.json"
              export PG_HOST_LABEL="casa-nas"
              ;;
            syn)
              pg_host="$TORI_HOST"; pg_port="$TORI_PORT"; pg_user="$TORI_USER"; pg_key="$TORI_SSH_KEY"
              pg_evidence_path="/var/services/homes/tori/backups/5151/pg-predeploy-evidence.json"
              export PG_HOST_LABEL="syn-nas"
              ;;
            *)
              echo "::error::unknown PG role '$PG_ROLE'"; exit 1 ;;
          esac
          pgkey="$(mktemp)"
          printf '%s\n' "$pg_key" > "$pgkey"
          chmod 600 "$pgkey"
          # 用 exec channel（ssh cat）拉回證據檔：兩台 bridge 都走這條路，避免 SFTP 子系統差異。
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p "$pg_port" -i "$pgkey" \
            "$pg_user@$pg_host" "cat '$pg_evidence_path'" > ./pg-predeploy-evidence.json
          rm -f "$pgkey"
          test -s ./pg-predeploy-evidence.json || { echo "::error::pg-predeploy-evidence.json is empty after ssh cat pull"; exit 1; }
          python3 - <<'PY'
          import json, os, re
          nas = json.load(open("nas-predeploy-evidence.json"))
          pg_raw = open("pg-predeploy-evidence.json").read()
          first_line = next((line for line in pg_raw.splitlines() if line.strip()), "")
          if not first_line.lstrip().startswith("{"):
              print("::error::pg-predeploy-evidence.json does not look like JSON; first 3 lines:")
              print("\n".join(pg_raw.splitlines()[:3]))
              raise SystemExit("pg-predeploy-evidence.json is not JSON (unexpected ssh cat output)")
          pg = json.loads(pg_raw)
          # 段一已選出 primary 主機角色；remote script 的 pg_backup_host 仍寫死 syn-nas，
          # 這裡依段一結果校正，避免證據把「從 CasaOS 做的備份」誤標成 syn-nas。
          pg["pg_backup_host"] = os.environ["PG_HOST_LABEL"]
          backup_id = nas.get("backup_dir") or ""
          # PG 時代：可回版的業務資料是 PG dump，以它的 sha256 作為備份身份（rollback 用的
          # BACKUP_HASH）；v3.db 的 sha256 只在 PG dump 缺失時當 fallback。
          backup_hash = pg.get("pg_backup_sha256") or nas.get("backup_sha256") or ""
          if not backup_id or not backup_hash:
              raise SystemExit("predeploy NAS evidence missing backup identity")
          if not backup_hash.startswith("sha256:"):
              backup_hash = "sha256:" + backup_hash
          if pg.get("pg_backup_ok") is not True:
              raise SystemExit("predeploy NAS PostgreSQL backup is not ok")
          if nas.get("ok") is not True:
              raise SystemExit("predeploy NAS evidence is not ok")
          digest = None
          digest_re = re.compile(r"sha256:[a-f0-9]{64}")
          for raw in (nas.get("repo_digests"), nas.get("image_ref")):
              if not raw:
                  continue
              match = digest_re.search(str(raw))
              if match:
                  digest = match.group(0)
                  break
          lines = [
              f"BACKUP_ID={backup_id}",
              f"BACKUP_HASH={backup_hash}",
              "BACKUP_VERIFIED=true",
              f"PG_BACKUP_HOST={pg.get('pg_backup_host') or ''}",
              f"PG_BACKUP_PATH={pg.get('pg_backup_path') or ''}",
              f"PG_CONTAINER={pg.get('pg_container') or ''}",
          ]
          if digest:
              lines.append(f"CURRENT_DIGEST={digest}")
              if nas.get("image_ref"):
                  lines.append(f"CURRENT_IMAGE_REF={nas.get('image_ref')}")
              if nas.get("image_id"):
                  lines.append(f"CURRENT_IMAGE_ID={nas.get('image_id')}")
              if nas.get("container"):
                  lines.append(f"CURRENT_CONTAINER={nas.get('container')}")
          open("phase15-backup.env","w").write("\n".join(lines) + "\n")
          PY
      - name: Write Phase 15 workflow evidence
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        env:
          WF_FILE: .github/workflows/production-predeploy-check.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ -f ./phase15-backup.env ]; then
            set -a
            # shellcheck disable=SC1091
            . ./phase15-backup.env
            set +a
          fi
          python3 .github/scripts/write-phase15-workflow-evidence.py phase15-workflow-evidence.json
      - name: Upload Phase 15 workflow evidence
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase15-workflow-evidence
          path: phase15-workflow-evidence.json
          if-no-files-found: error
      - name: Write Manual Owner workflow evidence
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        env:
          RELEASE_MODE: manual_owner
          WF_FILE: .github/workflows/production-predeploy-check.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}

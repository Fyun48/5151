name: 591-tracker

services:
  591-tracker-v3:
    container_name: 591-tracker-v3
    image: ghcr.io/fyun48/5151:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5153:5153"
      # 2026-09-24：收回 5155 別名埠。公開入口自 2026-09-23 起走 HAProxy 25153，5155 只剩
      # deploy 的本機健康探測用途；探測已改用 5153（同一個容器埠），故不再發佈第二個埠。
    environment:
      # v3 → OPS Console 的站內頁 feedback 交付。三個鍵要一起才有作用：
      # 遞送迴圈只由 `startWorkerLoops()` 啟動（角色 worker／all），所以**設在 APP_ROLE=web 的
      # 容器上不會跑**（2026-10-07 查實：公開站 web-A/web-B 是 web 角色，本服務未設 APP_ROLE＝all，
      # 是現行實際承担 worker 迴圈的那一個）。值放主機端 `.env`（600），不入 repo。
      # 預設 0／空 ⇒ 交付停用；feedback 仍照常寫進 feedback_outbox，使用者體驗不受影響。
      OPS_FEEDBACK_DELIVERY: ${OPS_FEEDBACK_DELIVERY:-0}
      OPS_INGEST_URL: ${OPS_INGEST_URL:-}
      OPS_INGEST_SECRET: ${OPS_INGEST_SECRET:-}
      HOST: "0.0.0.0"
      PORT: "5153"
      DATA_DIR: /data
      TZ: Asia/Taipei
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL_V3:-https://jibbyrenth.reversalplay.me}
      V1_DB_PATH: /v1-data/591.db
      V2_DB_PATH: /v2-data/v2.db
      # PostgreSQL 切換開關（佔位）。預設 sqlite：不設 PG_URL 時行為與現在完全相同。
      # 切換當天在 NAS 的 /mnt/Storage1/apps/5151/.env 追加 DB_DRIVER=postgres 與 PG_URL=… 後重建。
      # 見 docs/runbooks/postgres-cutover-day-checklist.md 步驟 5。
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      PG_URL: ${PG_URL:-}
      # 抓取輪次預算（分鐘）。2026-09-30（第九十一批）：正式站一輪「取頁 ＋ 落地」實測 25 分鐘上下，
      # 原本固定的 15 分鐘會在落地階段放棄 ⇒ 完成紀錄寫不進去、覆蓋條件每輪重跑。
      # 程式碼仍會逐批記錄完成（watcher.js），這裡只是把預算放寬到足以跑完。
      CRAWL_TICK_BUDGET_MINUTES: ${CRAWL_TICK_BUDGET_MINUTES:-40}
      # 媒體 CDN（Cloudflare R2）：MEDIA_SERVE=r2 時，會員素材庫的「公開顯示檔」由 CDN 直送；
      # `_o.jpg`（未浮水印原圖）與身分自拍照永不外流。預設 local＝行為與以前完全相同。
      # 值放在同目錄的 .env（發版只覆蓋 compose 與程式，不動 .env）。
      MEDIA_SERVE: ${MEDIA_SERVE:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_MEDIA_DOMAIN: ${R2_MEDIA_DOMAIN:-}
      R2_ZONE_ID: ${R2_ZONE_ID:-}
      R2_PURGE_TOKEN: ${R2_PURGE_TOKEN:-}
    volumes:
      - ${V3_DATA_ROOT:-/mnt/Storage1/docker_data/591-tracker-v3}:/data
      - ${V3_MEDIA_ROOT:-/mnt/5151-media}/member-media:/data/member-media
      - ${V3_MEDIA_ROOT:-/mnt/5151-media}/self-photos:/data/self-photos
      # R6：回饋附件也是**私有**媒體，必須跟 member-media／self-photos 放同一份共享儲存，
      # 否則 A 台上傳、B 台讀取會 404（HAProxy 輪詢兩台）。程式只認 DATA_DIR/feedback-media，
      # 所以只要把共享目錄疊上去，不必改程式。
      - ${V3_MEDIA_ROOT:-/mnt/5151-media}/feedback-media:/data/feedback-media
      - ${DATA_ROOT:-/DATA}/AppData/591-tracker:/v1-data:ro
      - ${DATA_ROOT:-/DATA}/AppData/591-tracker-v2:/v2-data:ro
      - ./v3/src:/app/src:ro
      - ./v3/public:/app/public:ro
    command: ["node", "--watch-path=src", "--watch-path=public", "src/server.js"]

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: 591-tracker-tunnel
    restart: unless-stopped
    network_mode: host
    # token 不進 argv（`docker inspect`／`ps` 看得到）：改掛檔、唯讀。
    # 2026-10-07：這條 tunnel 因舊 token 外流已換成新的 `5151-b`（id f36d61e6…），舊 `5151` 已刪除。
    volumes:
      - /mnt/Storage1/docker/591-tracker-tunnel/secrets:/run/secrets:ro
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/token
    command: tunnel --no-autoupdate run
    depends_on:
      - 591-tracker-v3

name: AI Autonomous Dev Loop & Deploy Pipeline

on:
  pull_request:
    types: [opened, synchronize] # 當 Cursor 本地發 PR，或雲端 Cursor 自動更新代碼時觸發

jobs:
  deepseek-gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 【步驟 1】Discord 通知：偵測到 Cursor 的 PR，DeepSeek 開始介入截斷
      - name: Notify Discord - DeepSeek Intercepted
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🛡️ DeepSeek 攔截把關中",
              "description": "偵測到由 Cursor 提交的 PR 分支。DeepSeek V4 Pro 已從中截斷，正在嚴格審查代碼品質...",
              "color": 3447003
            }]
          }' ${{ secrets.NOTIFICATION_WEBHOOK }}

      # 【步驟 2】呼叫 DeepSeek 進行代碼審查，並判斷是否需要修正或部署
      - name: DeepSeek Intelligence Analyzer
        id: deepseek
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
          model: 'deepseek-v4-pro'
          sys-prompt: |
            你是一位極度嚴格的首席架構師 (CTO)。請審查本次 PR 的代碼變更 (git diff)。
            請做出一項關鍵決策，並嚴格遵循以下輸出格式：
            
            [決策判定]
            如果代碼有任何 Bug、不安全或可以寫得更好的地方，請在第一行明確輸出：STATUS=NEED_FIX
            如果代碼已經完美無瑕，不需要任何修改，請在第一行明確輸出：STATUS=PASSED
            
            [具體修改指令]
            如果 STATUS=NEED_FIX，請用繁體中文列出具體的修改方針，並將這些方針轉化為「直接給下一個 AI 執行的精準提示詞命令」。
            
            [部署判定]
            請檢查使用者的 Commit 紀錄或 PR 標題，是否包含「部署」或「deploy」字眼。
            如果包含且代碼 PASSED，請輸出：DEPLOY_NOW=true，否則輸出：DEPLOY_NOW=false。

      # 【步驟 3】條件分支 A：如果 DeepSeek 判定有瑕疵 (NEED_FIX)，自動叫雲端 Cursor 幹活！
      - name: Cloud Cursor Automatic Auto-Fix Loop
        if: contains(steps.deepseek.outputs.summary, 'STATUS=NEED_FIX')
        uses: PunGrumpy/cursor-action@v1
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          # 直接將 DeepSeek 剛剛產出的「具體修改指令」當作提示詞，餵給雲端 Cursor 執行
          prompt: "這是首席架構師 DeepSeek 給出的代碼修改方針，請立刻將專案進行修正：${{ steps.deepseek.outputs.summary }}"

      # 【步驟 4】將雲端 Cursor 修正好的代碼，自動 Commit 並 PUSH 回同一個 PR（這會自動重啟本腳本，形成循環！）
      - name: Git Push Cursor Corrected Code
        if: contains(steps.deepseek.outputs.summary, 'STATUS=NEED_FIX')
        run: |
          git config --global user.name "Cloud-Cursor-Agent"
          git config --global user.email "cursor-agent@github.com"
          git add .
          git commit -m "style: [AI Auto-Fix] Cursor automatically fixed code based on DeepSeek review" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          
          # 同步通知 Discord 說正在自動修正中
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🔄 AI 自動循環修正中",
              "description": "DeepSeek 抓到了代碼瑕疵！已自動將「具體修改指令」下達給雲端 Cursor。Cursor 已在雲端改好並推進新代碼，正在重啟下一輪審查...",
              "color": 15105570
            }]
          }' ${{ secrets.NOTIFICATION_WEBHOOK }}

      # 【步驟 5】條件分支 B：如果 DeepSeek 判定完全 OK (PASSED)，且滿足部署條件
      - name: Auto Merge & Production Deploy
        if: |
          contains(steps.deepseek.outputs.summary, 'STATUS=PASSED') && 
          contains(steps.deepseek.outputs.summary, 'DEPLOY_NOW=true')
        run: |
          # 1. 透過 GitHub API 自動合併這個 PR 到 master
          curl -X PUT -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge \
            -d '{"commit_title":"chore: AI fully approved and auto-merged"}'
            
          # 2. 🚀 執行您的正式機部署指令（此處請根據您專案的實際部署方式填寫，例如 Vercel、Docker 等）
          echo "正在部署至正式機伺服器..."
          # npm run build && npm run deploy

      # 【步驟 6】發送最終大獲全勝通知到您的 Discord
      - name: Send Final Success Notification to Discord
        if: contains(steps.deepseek.outputs.summary, 'STATUS=PASSED')
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "✅ 專案品質達標！發佈成功！",
              "description": "DeepSeek 審查給予完美 PASSED 評價！PR 已自動合併。若有包含部署指令，正式機已順利上線完畢！",
              "color": 3066993
            }]
          }' ${{ secrets.NOTIFICATION_WEBHOOK }}

          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ -f ./phase15-backup.env ]; then
            set -a
            # shellcheck disable=SC1091
            . ./phase15-backup.env
            set +a
          fi
          python3 .github/scripts/write-manual-owner-workflow-evidence.py manual-owner-workflow-evidence.json
      - name: Upload Manual Owner workflow evidence

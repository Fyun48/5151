name: Deploy OPS to Synology NAS (manual)
run-name: "manual-owner-ops-synology:${{ inputs.sha }}"

# 只同步 ops/ + Synology OPS-only compose，並只重建 5151-ops。
# 這不是 v3 部署路徑：不 SCP v3/、不重建 591-tracker-v3、不碰 cloudflared/tunnel。
# 合併／push 到 master 不會自動跑；必須明確 workflow_dispatch，且從 master 定義啟動。
# 確認字串是 DEPLOY-OPS（不是 DEPLOY-PRODUCTION）。
# 正式 Production release live mutation 預設關閉（PRODUCTION_RELEASE_ALLOW_LIVE=0）。
# 使用獨立 Synology credentials（OPS_SYNOLOGY_*）+ 獨立 environment（ops-synology-production），
# 不與 v3/CasaOS 的 NAS_* 共用。runtime image 必須 pin 到 immutable digest。

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "要部署的完整 40 碼 commit SHA（必須可從 origin/master 追溯）"
        required: true
      image_digest:
        description: "immutable runtime image digest：sha256:<64 lowercase hex>"
        required: true
      confirmation:
        description: "輸入 DEPLOY-OPS 以確認只部署 OPS Console 到 Synology"
        required: true
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: ops-synology-deploy
  cancel-in-progress: false

jobs:
  sync-synology-ops:
    runs-on: ubuntu-latest
    environment: ops-synology-production
    timeout-minutes: 20
    steps:
      - name: Authorize OPS Synology deployment (fail-closed)
        env:
          WF_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRM: ${{ inputs.confirmation }}
          DEPLOY_SHA: ${{ inputs.sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [ "$WF_REF" != "refs/heads/master" ]; then
            echo "::error::OPS Synology deploy must run from the master workflow definition (got $WF_REF)"; exit 1
          fi
          if [ -z "${ALLOWED_ACTOR:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_ALLOWED_ACTOR is not configured; refusing (fail-closed)"; exit 1
          fi
          CURSOR_DEPLOY=0
          if [ "$ACTOR" = "cursor" ] || [ "$ACTOR" = "cursor[bot]" ]; then
            if [ "$TRIGGERING_ACTOR" = "cursor" ] || [ "$TRIGGERING_ACTOR" = "cursor[bot]" ]; then
              CURSOR_DEPLOY=1
            fi
          fi
          if [ "$CURSOR_DEPLOY" != 1 ] && [ "$ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::actor '$ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "$CURSOR_DEPLOY" != 1 ] && [ "$TRIGGERING_ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::triggering actor '$TRIGGERING_ACTOR' is not the authorized deployer (re-run by another user is refused)"; exit 1
          fi
          if [ "${CONFIRM:-}" != "DEPLOY-OPS" ]; then
            echo "::error::confirmation must be exactly DEPLOY-OPS"; exit 1
          fi
          if ! printf '%s' "${DEPLOY_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
          if ! printf '%s' "${IMAGE_DIGEST:-}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::image_digest must be sha256:<64 lowercase hex>"; exit 1
          fi
      - name: Checkout workflow-definition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate SHA reachable from origin/master, then check it out
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/master; then
            echo "::error::commit $DEPLOY_SHA is not reachable from origin/master; refusing"; exit 1
          fi
          git checkout --force "$DEPLOY_SHA"
          test -d ops/src
          test -f ops/src/server.js
          test -f ops/public/console.html
          test -f docker-compose.ops.synology.yml
      - name: Validate immutable image digest + OCI metadata (read-only)
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$IMAGE_REPO:$DEPLOY_SHA"
          PIN="$IMAGE_REPO@$IMAGE_DIGEST"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null 2>&1
          docker buildx imagetools inspect "$TAG" >/dev/null 2>&1 || { echo "::error::candidate tag does not exist: $TAG"; exit 1; }
          ACTUAL="$(docker buildx imagetools inspect "$TAG" | awk '/^Digest:/{print $2; found=1} END{if(!found) exit 1}')"
          printf '%s' "$ACTUAL" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::could not resolve immutable manifest digest for $TAG"; exit 1; }
          echo "tag_manifest_digest=$ACTUAL"
          [ "$ACTUAL" = "$IMAGE_DIGEST" ] || { echo "::error::tag digest $ACTUAL != requested $IMAGE_DIGEST"; exit 1; }
          docker pull --platform linux/amd64 "$PIN"
          REV="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PIN")"
          SRC="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$PIN")"
          echo "oci_revision=$REV"
          echo "oci_source=$SRC"
          [ "$REV" = "$DEPLOY_SHA" ] || { echo "::error::OCI revision '$REV' != DEPLOY_SHA $DEPLOY_SHA"; exit 1; }
          EXPECT_SRC="https://github.com/${GITHUB_REPOSITORY}"
          [ "${SRC,,}" = "${EXPECT_SRC,,}" ] || { echo "::error::OCI source '$SRC' is not this repository"; exit 1; }
          echo "OPS_RUNTIME_IMAGE=$PIN" >> "$GITHUB_ENV"
      - name: Resolve deploy paths (env -> shell default, no expression literals)
        env:
          APP_ROOT_IN: ${{ vars.OPS_SYNOLOGY_APP_ROOT }}
          DATA_ROOT_IN: ${{ vars.OPS_SYNOLOGY_DATA_ROOT }}
        run: |
          set -euo pipefail
          echo "OPS_SYNOLOGY_APP_ROOT=${APP_ROOT_IN:-/volume1/docker/5151-ops/app}" >> "$GITHUB_ENV"
          echo "OPS_SYNOLOGY_DATA_ROOT=${DATA_ROOT_IN:-/volume1/docker/5151-ops/data}" >> "$GITHUB_ENV"
      - name: NAS SSH endpoint (Cloudflare Access bridge, falls back to public SSH)
        id: cf-bridge
        uses: ./.github/actions/cf-ssh-bridge
        with:
          hostname: ssh-tori.reversalplay.me
          port: "2223"
          client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          fallback-host: ${{ secrets.OPS_SYNOLOGY_HOST }}
          fallback-port: ${{ secrets.OPS_SYNOLOGY_PORT }}
      - name: Stage OPS source + compose into clean per-SHA dir via native scp
        env:
          OPS_SYNOLOGY_HOST: ${{ steps.cf-bridge.outputs.host }}
          OPS_SYNOLOGY_PORT: ${{ steps.cf-bridge.outputs.port }}
          OPS_SYNOLOGY_USER: ${{ secrets.OPS_SYNOLOGY_USER }}
          OPS_SYNOLOGY_SSH_KEY: ${{ secrets.OPS_SYNOLOGY_SSH_KEY }}
          OPS_SYNOLOGY_APP_ROOT: ${{ env.OPS_SYNOLOGY_APP_ROOT }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          install -d "$HOME/.ssh"
          printf '%s\n' "$OPS_SYNOLOGY_SSH_KEY" > "$HOME/.ssh/id_ops"
          chmod 600 "$HOME/.ssh/id_ops"
          # scp 的 port flag 是 -P（大寫），ssh 是 -p（小寫）；分開兩組 options。
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ops" -p "$OPS_SYNOLOGY_PORT")
          SCP_OPTS=(-O -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ops" -P "$OPS_SYNOLOGY_PORT")
          INCOMING="$OPS_SYNOLOGY_APP_ROOT/incoming/$DEPLOY_SHA"
          # 只允許 bounded staging 目錄（防 path 逃逸）。
          case "$INCOMING" in
            "$OPS_SYNOLOGY_APP_ROOT/incoming/"*) ;;
            *) echo "::error::incoming path escapes APP_ROOT"; exit 1;;
          esac
          # 清空並重建這個 per-SHA staging 目錄（不 merge 舊 incoming tree）。
          ssh "${SSH_OPTS[@]}" "$OPS_SYNOLOGY_USER@$OPS_SYNOLOGY_HOST" "rm -rf '$INCOMING' && mkdir -p '$INCOMING'"
          scp "${SCP_OPTS[@]}" -r ops docker-compose.ops.synology.yml "$OPS_SYNOLOGY_USER@$OPS_SYNOLOGY_HOST:$INCOMING/"
      - name: NAS SSH endpoint (Cloudflare Access bridge, falls back to public SSH)
        id: cf-bridge
        uses: ./.github/actions/cf-ssh-bridge
        with:
          hostname: ssh-tori.reversalplay.me
          port: "2223"
          client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          fallback-host: ${{ secrets.OPS_SYNOLOGY_HOST }}
          fallback-port: ${{ secrets.OPS_SYNOLOGY_PORT }}
      - name: Deploy 5151-ops on Synology via native ssh (preflight + backup + rollback)
        env:
          OPS_SYNOLOGY_HOST: ${{ steps.cf-bridge.outputs.host }}
          OPS_SYNOLOGY_PORT: ${{ steps.cf-bridge.outputs.port }}
          OPS_SYNOLOGY_USER: ${{ secrets.OPS_SYNOLOGY_USER }}
          OPS_SYNOLOGY_SSH_KEY: ${{ secrets.OPS_SYNOLOGY_SSH_KEY }}
          OPS_SYNOLOGY_APP_ROOT: ${{ env.OPS_SYNOLOGY_APP_ROOT }}
          OPS_SYNOLOGY_DATA_ROOT: ${{ env.OPS_SYNOLOGY_DATA_ROOT }}
          OPS_RUNTIME_IMAGE: ${{ env.OPS_RUNTIME_IMAGE }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          install -d "$HOME/.ssh"
          printf '%s\n' "$OPS_SYNOLOGY_SSH_KEY" > "$HOME/.ssh/id_ops"
          chmod 600 "$HOME/.ssh/id_ops"
          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ops" -p "$OPS_SYNOLOGY_PORT" \
              "$OPS_SYNOLOGY_USER@$OPS_SYNOLOGY_HOST" \
              "DEPLOY_SHA='$DEPLOY_SHA' OPS_SYNOLOGY_APP_ROOT='$OPS_SYNOLOGY_APP_ROOT' OPS_SYNOLOGY_DATA_ROOT='$OPS_SYNOLOGY_DATA_ROOT' OPS_RUNTIME_IMAGE='$OPS_RUNTIME_IMAGE' bash -s" \
              < .github/scripts/deploy-ops-synology-remote.sh

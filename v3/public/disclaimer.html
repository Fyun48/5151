<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>免責聲明 · 吉比租房物件追蹤</title>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap { width: min(640px, calc(100vw - 32px)); margin: 40px auto; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: none;
      padding: 22px 20px 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-family: "Noto Serif TC", "Source Han Serif TC", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
    .body { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    a { color: var(--accent-deep); }
    .back { display: inline-block; margin-top: 18px; }
    .site-footer {
      margin: 16px 4px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card">
      <h1>免責聲明</h1>
      <p class="sub">免費系統 · 贊助是自願的</p>
      <div class="body" id="text">載入中…</div>
      <a class="back" href="/login.html">返回登入／註冊</a>
    </article>
    <footer class="site-footer">reversal play tech | 逆遊科技</footer>
  </div>
  <script>
    fetch("/api/disclaimer").then((r) => r.json()).then((data) => {
      document.getElementById("text").textContent = data.text || "";
    }).catch(() => {
      document.getElementById("text").textContent = "暫時讀不到免責聲明，請稍後再試。";
    });
  </script>
</body>
</html>

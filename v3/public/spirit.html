<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>本站在做什麼 · 吉比租房物件追蹤</title>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: clip; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }
    main {
      width: min(680px, calc(100% - 32px));
      margin: 28px auto 80px;
    }
    h1 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
    }
    h2 {
      margin: 28px 0 8px;
      font-size: 18px;
      font-weight: 700;
    }
    p, li { color: var(--ink); font-size: 15px; }
    .muted { color: var(--muted); }
    a { color: var(--accent-deep); }
    .back { display: inline-block; margin-bottom: 18px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← 回找房</a>
    <h1 id="spiritTitle">這個站為什麼存在</h1>
    <div id="spiritBody"></div>
    <p><a href="/">開始找房</a> · <a href="/login.html?register=1">註冊</a></p>
  </main>
  <script>
    (function () {
      const root = document.getElementById("spiritBody");
      function renderInto(body) {
        root.innerHTML = "";
        const blocks = String(body || "").replace(/\r\n/g, "\n").split(/\n{2,}/);
        for (const raw of blocks) {
          const lines = raw.split("\n").map((s) => s.replace(/\s+$/, "")).filter((s) => s.trim() !== "");
          if (!lines.length) continue;
          let i = 0;
          if (lines[0].trim().startsWith("## ")) {
            const h = document.createElement("h2");
            h.textContent = lines[0].trim().slice(3).trim();
            root.appendChild(h);
            i = 1;
          }
          let ul = null;
          for (; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.startsWith("- ")) {
              if (!ul) { ul = document.createElement("ul"); root.appendChild(ul); }
              const li = document.createElement("li");
              li.textContent = line.slice(2).trim();
              ul.appendChild(li);
            } else {
              ul = null;
              const p = document.createElement("p");
              p.textContent = line;
              root.appendChild(p);
            }
          }
        }
      }
      fetch("/api/spirit", { cache: "no-store" })
        .then((r) => r.json())
        .then((data) => {
          if (data && data.title) {
            document.getElementById("spiritTitle").textContent = data.title;
            document.title = data.title + " · 吉比租房物件追蹤";
          }
          renderInto(data && data.body ? data.body : "");
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>

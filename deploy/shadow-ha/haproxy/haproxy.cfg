# 5151 Shadow HA — HAProxy template (Phase 15)
# Listens:
#   25433  postgres-rw   (only the current primary)
#   25434  postgres-ro   (standby first, primary fallback)
#   15153  web           (round-robin Web-A / Web-B)
#
# Host IPs are substituted from env (CASAOS_HOST / SYNOLOGY_HOST) by docker compose.
# Health checks must distinguish primary / standby / web; the router must NOT
# promote PostgreSQL itself (promotion is manual — see the failover runbook).

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 2

# --- PostgreSQL routing -------------------------------------------------
# Native PostgreSQL auth check proves the server accepts connections. For
# primary/standby role separation, `postgres-rw` points only at the primary
# and `postgres-ro` prefers the standby. On a manual failover the runbook
# re-points these backends; the application DB router additionally verifies
# pg_is_in_recovery() for read-after-write safety.

frontend pg_rw
    bind *:25433
    default_backend pg_primary

frontend pg_ro
    bind *:25434
    default_backend pg_standby_first

backend pg_primary
    option pgsql-check user postgres
    # Primary is CasaOS by default. After failover to Synology, swap the order
    # (or use a health query that returns 0 rows only when NOT in recovery).
    server pg-a ${CASAOS_HOST}:15432 check inter 3s fall 3 rise 2
    server pg-b ${SYNOLOGY_HOST}:15432 check inter 3s fall 3 rise 2 backup

backend pg_standby_first
    option pgsql-check user postgres
    # Prefer the standby for read traffic; fall back to primary if standby down.
    server pg-b ${SYNOLOGY_HOST}:15432 check inter 3s fall 3 rise 2
    server pg-a ${CASAOS_HOST}:15432 check inter 3s fall 3 rise 2 backup

# --- Web routing ---------------------------------------------------------
frontend web
    bind *:15153
    default_backend web_nodes

backend web_nodes
    mode http
    option httpchk GET /api/public/health
    http-check expect status 200
    server web-a ${CASAOS_HOST}:5153 check inter 3s fall 3 rise 2
    server web-b ${SYNOLOGY_HOST}:5153 check inter 3s fall 3 rise 2

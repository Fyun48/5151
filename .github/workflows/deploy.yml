name: Copy source to CasaOS

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-nas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy src and public only
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: "src,public"
          target: /mnt/Storage1/apps/5151
          overwrite: true

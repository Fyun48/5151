name: 5151-shadow-pg-standby

# Shadow PostgreSQL-B (Hot Standby) for Synology. Isolated from production.
# Two-phase start:
#   1) `docker compose run --rm standby-basebackup` pulls a base backup from the
#      primary (via pg_basebackup) into the shared volume.
#   2) `docker compose up -d` starts postgres in standby mode (standby.signal).
services:
  5151-postgres-B:
    container_name: 5151-postgres-B
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD:?set PG_SUPER_PASSWORD}
      POSTGRES_DB: 5151_shadow
      PGDATA: /var/lib/postgresql/data/pgdata
    # The standby runs as a read-only follower. primary_conninfo + primary_slot_name
    # are set by setup-standby.sh into postgresql.auto.conf inside the volume.
    volumes:
      - 5151-shadow-pg-b:/var/lib/postgresql/data
    networks:
      - shadow-pg

  # One-shot base-backup helper. Never runs as a daemon.
  standby-basebackup:
    image: postgres:16-alpine
    profiles: ["setup"]
    environment:
      PGPASSWORD: ${PG_REPLICATION_PASSWORD:?set PG_REPLICATION_PASSWORD}
      CASAOS_HOST: ${CASAOS_HOST:?set CASAOS_HOST (primary LAN IP)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -rf /var/lib/postgresql/data/pgdata/*
        pg_basebackup -h "$$CASAOS_HOST" -p 15432 -U replicator \
          -D /var/lib/postgresql/data/pgdata -X stream -P -R \
          --slot=standby_b -C
        touch /var/lib/postgresql/data/pgdata/standby.signal
    volumes:
      - 5151-shadow-pg-b:/var/lib/postgresql/data
    networks:
      - shadow-pg

volumes:
  5151-shadow-pg-b:

networks:
  shadow-pg:

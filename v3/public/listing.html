<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>物件分享 · 吉比租房物件追蹤</title>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); color: var(--ink, #1f1b16); background: var(--bg, #f7f4ef); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
    header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; }
    .brand { font-weight: 800; letter-spacing: 0.02em; }
    .brand a { color: inherit; text-decoration: none; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    .price { font-size: 22px; font-weight: 800; color: var(--accent-deep, #a6532b); }
    .meta { color: var(--muted, #6b6258); font-size: 14px; margin: 2px 0; }
    .card { background: var(--paper, #fff); border: 1px solid var(--line, #e7ded2); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .gallery button { padding: 0; border: 1px solid var(--line, #e7ded2); border-radius: 8px; overflow: hidden; background: #eee; aspect-ratio: 4/3; cursor: pointer; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line, #e7ded2); background: #eee; margin-bottom: 8px; cursor: zoom-in; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--accent-mist, #f3ece3); border: 1px solid var(--line, #e7ded2); }
    .body { white-space: pre-wrap; line-height: 1.7; }
    .contact a { color: var(--accent-deep, #a6532b); }
    .cta { position: sticky; bottom: 0; margin-top: 16px; background: var(--accent-mist, #f3ece3); border: 1px solid var(--line, #e7ded2); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .cta a.btn { background: var(--accent, #c9773f); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
    .muted { color: var(--muted, #6b6258); font-size: 13px; }
    /* lightbox */
    .lb { position: fixed; inset: 0; background: rgba(20,16,12,0.92); display: none; z-index: 100; }
    .lb.open { display: flex; align-items: center; justify-content: center; }
    .lb img { max-width: 96vw; max-height: 82vh; object-fit: contain; border-radius: 8px; }
    .lb .lb-close { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 14px; }
    .lb button { background: rgba(255,255,255,0.14); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
    .lb .lb-prev { position: fixed; left: 10px; top: 50%; transform: translateY(-50%); }
    .lb .lb-next { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); }
    .lb .lb-count { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
    .err { text-align: center; padding: 40px 12px; color: var(--muted, #6b6258); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><a href="/">吉比租房物件追蹤</a></div>
      <a class="muted" href="/login.html">登入 / 註冊</a>
    </header>
    <main id="main"><p class="err" id="loading">載入中…</p></main>
  </div>

  <div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="照片瀏覽">
    <button class="lb-close" id="lbClose" aria-label="關閉">✕</button>
    <button class="lb-prev" id="lbPrev" aria-label="上一張">‹</button>
    <img id="lbImg" alt="物件照片" />
    <button class="lb-next" id="lbNext" aria-label="下一張">›</button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const idMatch = location.pathname.match(/\/l\/(\d+)/);
    const listingId = idMatch ? idMatch[1] : "";
    let photos = [];
    let lbIndex = 0;

    function openLightbox(i) {
      if (!photos.length) return;
      lbIndex = (i + photos.length) % photos.length;
      $("lbImg").src = photos[lbIndex];
      $("lbCount").textContent = `${lbIndex + 1} / ${photos.length}`;
      $("lightbox").classList.add("open");
    }
    function closeLightbox() { $("lightbox").classList.remove("open"); }
    $("lbClose").addEventListener("click", closeLightbox);
    $("lbPrev").addEventListener("click", () => openLightbox(lbIndex - 1));
    $("lbNext").addEventListener("click", () => openLightbox(lbIndex + 1));
    $("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) closeLightbox(); });
    document.addEventListener("keydown", (e) => {
      if (!$("lightbox").classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") openLightbox(lbIndex - 1);
      else if (e.key === "ArrowRight") openLightbox(lbIndex + 1);
    });
    // 手機 swipe
    let touchX = null;
    $("lightbox").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    $("lightbox").addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) openLightbox(lbIndex + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });

    function render(d) {
      photos = Array.isArray(d.photos) && d.photos.length ? d.photos : (d.cover ? [d.cover] : []);
      const cover = photos[0] || "";
      const thumbs = photos.map((u, i) => `<button type="button" data-i="${i}" aria-label="放大第 ${i + 1} 張照片"><img src="${esc(u)}" alt="物件照片 ${i + 1}" loading="lazy" /></button>`).join("");
      const chips = (d.trait_labels || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("");
      const contactBits = [];
      if (d.contact_name) contactBits.push(`聯絡：${esc(d.contact_name)}${d.contact_role ? "（" + esc(d.contact_role) + "）" : ""}`);
      if (d.phone) contactBits.push(`電話：<a href="tel:${esc(d.phone)}">${esc(d.phone)}</a>`);
      if (d.line_url) contactBits.push(`<a href="${esc(d.line_url)}" rel="nofollow noopener" target="_blank">LINE 聯絡</a>`);
      $("main").innerHTML = `
        ${cover ? `<img class="cover" id="coverImg" src="${esc(cover)}" alt="${esc(d.title)}" />` : ""}
        <h1>${esc(d.title || "租屋物件")}</h1>
        <div class="price">${esc(d.price || (d.price_num ? d.price_num + " 元/月" : ""))}</div>
        <p class="meta">${esc(d.address || "")}</p>
        <p class="meta">${[d.kind_name, d.layout, d.area_name, d.floor_name].filter(Boolean).map(esc).join("・")}</p>
        ${photos.length > 1 ? `<div class="card"><div class="gallery" id="gallery">${thumbs}</div></div>` : ""}
        ${chips ? `<div class="card"><div class="chips">${chips}</div></div>` : ""}
        ${d.body ? `<div class="card"><div class="body">${esc(d.body)}</div></div>` : ""}
        ${contactBits.length ? `<div class="card contact">${contactBits.join("<br />")}</div>` : ""}
        <div class="cta">
          <span class="muted">註冊會員可使用特別關注、通知與更多找房功能。</span>
          <a class="btn" href="/login.html">免費註冊</a>
        </div>`;
      $("coverImg")?.addEventListener("click", () => openLightbox(0));
      $("gallery")?.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-i]");
        if (b) openLightbox(Number(b.dataset.i));
      });
      document.title = `${d.title || "租屋物件"} · 吉比租房物件追蹤`;
    }

    async function load() {
      if (!listingId) { $("main").innerHTML = '<p class="err">找不到物件。</p>'; return; }
      try {
        const res = await fetch(`/api/public/self-listing/${encodeURIComponent(listingId)}`);
        if (!res.ok) { $("main").innerHTML = '<p class="err">這則物件不存在或已下架。</p>'; return; }
        render(await res.json());
      } catch {
        $("main").innerHTML = '<p class="err">載入失敗，請稍後再試。</p>';
      }
    }
    load();
  </script>
</body>
</html>

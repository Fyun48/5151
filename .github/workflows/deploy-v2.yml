name: Deploy v2 to CasaOS (manual)

# v2 已拆除。檔名保留以免舊連結 404；授權檢查與正式部署護欄仍在，實際步驟一律拒絕。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "v2 已拆除，請改走 Deploy v3。此欄僅為護欄格式。"
        required: true
      confirmation:
        description: "輸入 DEPLOY-PRODUCTION（仍會被拒絕；請改走 Deploy v3）"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  refuse-retired-v2:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Authorize production deployment (fail-closed)
        env:
          WF_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRM: ${{ inputs.confirmation }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$WF_REF" != "refs/heads/master" ]; then
            echo "::error::Production deploy must run from the master workflow definition (got $WF_REF)"; exit 1
          fi
          if [ -z "${ALLOWED_ACTOR:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_ALLOWED_ACTOR is not configured; refusing (fail-closed)"; exit 1
          fi
          if [ "$ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::actor '$ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "$TRIGGERING_ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::triggering actor '$TRIGGERING_ACTOR' is not the authorized deployer (re-run by another user is refused)"; exit 1
          fi
          if [ "${CONFIRM:-}" != "DEPLOY-PRODUCTION" ]; then
            echo "::error::confirmation must be exactly DEPLOY-PRODUCTION"; exit 1
          fi
          if ! printf '%s' "${DEPLOY_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
      - name: Checkout master (for ancestry validation)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Validate SHA reachable from origin/master, then check it out
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/master; then
            echo "::error::commit $DEPLOY_SHA is not reachable from origin/master; refusing"; exit 1
          fi
          git checkout --force "$DEPLOY_SHA"
      - name: v2 retired
        run: |
          echo "::error::v2 已拆除，請改走 Deploy v3 to CasaOS (manual)"; exit 1

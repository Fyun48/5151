name: 591-tracker

services:
  591-tracker:
    container_name: 591-tracker
    image: ghcr.io/fyun48/5151:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5151:5151"
    environment:
      HOST: "0.0.0.0"
      PORT: "5151"
      DATA_DIR: /data
      TZ: Asia/Taipei
      AUTH_EMAIL: ${AUTH_EMAIL:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/591-tracker:/data
      - ./src:/app/src:ro
      - ./public:/app/public:ro
    command: ["node", "--watch-path=src", "--watch-path=public", "src/server.js"]

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: 591-tracker-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - 591-tracker

name: 5151-shadow-web-b

# Web-B（Synology / TORI_NAS01，192.168.0.220）— HAProxy web backend 的第二台。
#
# ⚠️ 這裡是**去識別化的模板**，實際在跑的正本是主機上的
#    `~/5151-shadow/web-b/docker-compose.yml`（tori 家目錄）。
#    發版不改這個檔，只改同目錄的 `.env`（`V3_IMAGE=<digest pin>`）；
#    deploy-v3.yml 的 "Recreate B-group web node…" 步驟會自動做這件事。
services:
  5151-web-B:
    container_name: 5151-web-B
    # 與 A 組、正式站同一個 digest（A/B 是同一組後端，版本必須一致）。
    image: ${V3_IMAGE:?digest-pinned release image（deploy-v3.yml 寫入 .env）}
    restart: unless-stopped
    ports:
      # 0.0.0.0 綁定：CasaOS 上的 HAProxy 要連得到（綁 127.0.0.1 只有本機可見 → 節點 DOWN）。
      - "0.0.0.0:15153:5153"
    environment:
      HOST: "0.0.0.0"
      PORT: "5153"
      APP_ROLE: "web"
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?shared across web nodes}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      PG_URL: ${PG_URL:?postgres://…@<haproxy>:25433/<db>}
      # 媒體 CDN（Cloudflare R2）：MEDIA_SERVE=r2 時，會員素材庫的「公開顯示檔」由 CDN 直送；
      # `_o.jpg`（未浮水印原圖）與身分自拍照永不外流。預設 local＝行為與以前完全相同。
      # ⚠️ 主機上的 compose 才是正本（這裡是去識別化模板）：實際值寫在主機 compose 的 environment，
      #    因為 deploy-v3.yml 每次發版都會覆寫 .env，放 .env 會被蓋掉。
      MEDIA_SERVE: ${MEDIA_SERVE:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_MEDIA_DOMAIN: ${R2_MEDIA_DOMAIN:-}
      R2_ZONE_ID: ${R2_ZONE_ID:-}
      R2_PURGE_TOKEN: ${R2_PURGE_TOKEN:-}
      TZ: Asia/Taipei
    volumes:
      - ${WEB_B_DATA_DIR:-~/5151-shadow/web-b/data}:/data
      - /volume1/5151-media/member-media:/data/member-media
      - /volume1/5151-media/self-photos:/data/self-photos
    command: ["node", "src/server.js"]

  # worker 用 profile 關起來（2026-09-23：正式站的 worker 已在跑同一批工作，多一個會搶 job）。
  # 發版只重建 `5151-web-B`，profile 沒開所以它不會被拉起來。
  5151-worker:
    container_name: 5151-worker
    profiles: ["worker"]
    image: ${V3_IMAGE:?digest-pinned release image（deploy-v3.yml 寫入 .env）}
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "5153"
      APP_ROLE: "worker"
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?shared across web nodes}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      PG_URL: ${PG_URL:?postgres://…@<haproxy>:25433/<db>}
      # 媒體 CDN（Cloudflare R2）：MEDIA_SERVE=r2 時，會員素材庫的「公開顯示檔」由 CDN 直送；
      # `_o.jpg`（未浮水印原圖）與身分自拍照永不外流。預設 local＝行為與以前完全相同。
      # ⚠️ 主機上的 compose 才是正本（這裡是去識別化模板）：實際值寫在主機 compose 的 environment，
      #    因為 deploy-v3.yml 每次發版都會覆寫 .env，放 .env 會被蓋掉。
      MEDIA_SERVE: ${MEDIA_SERVE:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_MEDIA_DOMAIN: ${R2_MEDIA_DOMAIN:-}
      R2_ZONE_ID: ${R2_ZONE_ID:-}
      R2_PURGE_TOKEN: ${R2_PURGE_TOKEN:-}
      TZ: Asia/Taipei
    volumes:
      - ${WEB_B_DATA_DIR:-~/5151-shadow/web-b/data}:/data
      - /volume1/5151-media/member-media:/data/member-media
      - /volume1/5151-media/self-photos:/data/self-photos
    command: ["node", "src/server.js"]


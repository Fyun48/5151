name: Deploy v2 to CasaOS (manual)

# v2 已拆除。這個 workflow 只保留檔名，避免舊連結 404；任何觸發都 fail-closed。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "v2 已拆除，請改走 Deploy v3"
        required: true
      confirmation:
        description: "v2 已拆除，請改走 Deploy v3"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  refuse-retired-v2:
    runs-on: ubuntu-latest
    steps:
      - name: v2 retired
        run: |
          echo "::error::v2 已拆除，請改走 Deploy v3 to CasaOS (manual)"; exit 1

name: Build production image (no deploy)

# 只建置並推送不可變 SHA tag。不 SSH、不重啟 CasaOS、不改 :latest。
# 合併/push 不會自動執行；必須 workflow_dispatch 且指定完整 40 碼 master SHA。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "要建置的完整 40 碼 commit SHA（必須可從 origin/master 追溯）"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-production-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate SHA input
        env:
          BUILD_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${BUILD_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
      - name: Checkout master (for ancestry validation)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Validate SHA reachable from origin/master, then check it out
        env:
          BUILD_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$BUILD_SHA" origin/master; then
            echo "::error::commit $BUILD_SHA is not reachable from origin/master; refusing"; exit 1
          fi
          git checkout --force "$BUILD_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.sha }}
            ${{ steps.image.outputs.name }}:predeploy-${{ inputs.sha }}
      - name: Verify sharp inside built amd64 image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.sha }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" node -e "import('sharp').then(()=>console.log('SHARP_OK')).catch(()=>{console.error('SHARP_MISSING'); process.exit(1)})"
          docker run --rm --platform linux/amd64 "$IMAGE" node -e "console.log('NODE', process.version)"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "IMAGE_TAG=$IMAGE"

name: Tests

on:
  push:
    branches:
      - master
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Tests 只負責驗證程式。
# 不具有 Merge、PR 寫入或 Actions 寫入權限。
permissions:
  contents: read

# 同一個 PR / branch 有新 commit 時，
# 取消舊的測試，避免浪費 Actions 資源。
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # Ops / full test suite 可能需要較長時間。
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      # 暫時維持既有 CI 的測試語意。
      # Dependency installation 若要加入，另外開 PR 處理，
      # 不與移除 Auto-merge 這項治理修正混在一起。
      - name: Run Test Suite
        shell: bash
        run: |
          set -euo pipefail

          echo "[Tests] Starting npm test..."
          npm test
          echo "[Tests] npm test completed successfully."

      - name: Tests Passed
        shell: bash
        run: |
          echo "✅ Tests PASSED."
          echo "This workflow performed no merge."
          echo "This workflow performed no Production deployment."

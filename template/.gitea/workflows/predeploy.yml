name: Predeploy check (no deploy)
# Fail-closed safety gates before any production deploy: backup, integrity,
# smoke checks. Does not deploy.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to check'
        required: true
jobs:
  predeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha }}
      - name: Backup + integrity + smoke
        run: ./scripts/predeploy-check.sh ${{ github.event.inputs.sha }}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登入 · 591 物件追蹤（v2）</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1f1a16;
      --muted: #6d645c;
      --line: #e6ddd2;
      --accent: #c45c26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "IwanMincho", "Source Han Serif TC", "Noto Serif TC", "PMingLiU", serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #f8e7d4 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.05);
      padding: 28px 26px 24px;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.08em; }
    .sub { color: var(--muted); font-size: 14px; margin: 8px 0 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .tabs button {
      margin: 0;
      width: auto;
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input:not([type="checkbox"]) {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: 14px/1.5 "Noto Sans TC", sans-serif;
      background: #fff;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 14px;
      font: 13px/1.5 "Noto Sans TC", sans-serif;
      color: var(--muted);
    }
    .check input { margin-top: 3px; }
    a { color: var(--accent); }
    button {
      margin-top: 18px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 11px 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font: 15px/1 "Noto Sans TC", sans-serif;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .err { min-height: 1.4em; color: #9a3412; font-size: 13px; margin-top: 10px; font-family: "Noto Sans TC", sans-serif; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>591 物件追蹤（v2 開發版）</h1>
    <p class="sub">此為新版測試站，資料與線上版分開。可登入既有帳號，或註冊新會員。</p>
    <div class="tabs">
      <button type="button" class="on" id="tabLogin">登入</button>
      <button type="button" id="tabRegister">註冊</button>
    </div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="loginBtn">登入</button>
    </form>
    <form id="registerForm" class="hidden">
      <label for="regEmail">Email</label>
      <input id="regEmail" name="email" type="email" autocomplete="username" required />
      <label for="regPassword">密碼（至少 8 個字）</label>
      <input id="regPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="regPassword2">再輸入一次密碼</label>
      <input id="regPassword2" name="password2" type="password" autocomplete="new-password" minlength="8" required />
      <label class="check">
        <input id="accept" type="checkbox" required />
        <span>我已閱讀並同意<a href="/disclaimer.html" target="_blank" rel="noopener">免責聲明</a>：這是免費系統，贊助是自願的。</span>
      </label>
      <button type="submit" id="registerBtn">同意並註冊</button>
    </form>
    <p class="err" id="err"></p>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const justLoggedOut = new URLSearchParams(location.search).has("logout");
    const showRegister = new URLSearchParams(location.search).has("register");
    function setMode(register) {
      $("tabLogin").classList.toggle("on", !register);
      $("tabRegister").classList.toggle("on", register);
      $("loginForm").classList.toggle("hidden", register);
      $("registerForm").classList.toggle("hidden", !register);
      $("err").textContent = "";
    }
    $("tabLogin").onclick = () => setMode(false);
    $("tabRegister").onclick = () => setMode(true);
    if (showRegister) setMode(true);
    fetch("/api/me").then((r) => r.json()).then((data) => {
      if (data.ok && !justLoggedOut) location.replace("/");
    }).catch(() => {});
    $("loginForm").onsubmit = async (ev) => {
      ev.preventDefault();
      $("loginBtn").disabled = true;
      $("err").textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            email: $("email").value.trim(),
            password: $("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "登入失敗");
        location.replace("/");
      } catch (error) {
        $("err").textContent = error.message;
      } finally {
        $("loginBtn").disabled = false;
      }
    };
    $("registerForm").onsubmit = async (ev) => {
      ev.preventDefault();
      $("registerBtn").disabled = true;
      $("err").textContent = "";
      try {
        if ($("regPassword").value !== $("regPassword2").value) {
          throw new Error("兩次密碼不一樣");
        }
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            email: $("regEmail").value.trim(),
            password: $("regPassword").value,
            acceptDisclaimer: $("accept").checked,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "註冊失敗");
        location.replace("/");
      } catch (error) {
        $("err").textContent = error.message;
      } finally {
        $("registerBtn").disabled = false;
      }
    };
  </script>
</body>
</html>

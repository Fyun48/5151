name: 5151-tracker-tunnel-b

# 公開站 tunnel（現行 `5151-b` / f36d61e6-bc8a-4535-8187-d0e34b2111c9）在 Synology 的第二個 connector。
#
# 為什麼需要它：公開站的 ingress 是 `http://127.0.0.1:25153`，而 cloudflared 把 `127.0.0.1`
# 解析成「自己那台主機」。原本只有 CasaOS 的 `591-tracker-tunnel` 一個實例（掛掉＝站掛掉），
# 現在 Synology 這台也跑一個實例，指到本機的 `5151-haproxy-B`（見 deploy/shadow-ha/haproxy/）。
# 兩個實例註冊同一條 tunnel → Cloudflare 邊緣可以擇一送；任一台主機掛掉都還有入口。
#
# 注意：`~/5151-shadow/cloudflared/`（`5151-cloudflared-B`）接的是**另一條** shadow 測試 tunnel
# （現行 `5151-shadow-web-b`／7d50bfb7…，ingress 指 192.168.0.140:25153），與公開站無關，不要混用。
#
# 🔐 token 的放法（2026-10-07 改掉舊做法）：
#   舊寫法是 `command: tunnel run --token ${TUNNEL_TOKEN}` ⇒ token 出現在容器 command line，
#   任何有 docker 權限的身分用 `docker inspect`／`docker ps` 就讀得到。**已停用**，不要回退。
#   現行：token 放 `secrets/token`（本機 0400／目錄 0700，只有 tori 可讀），
#   以 `:ro` 掛進 `/run/secrets/token`，容器用 `TUNNEL_TOKEN_FILE` 讀它。
#   Synology 上 root 才能 chown 給影像內 uid 65532，而 tori **沒有免密 sudo**，
#   所以這裡改用 `user: "1026:100"`（＝tori 本身）跑容器，讓 0400 的檔不需要放寬成世界可讀。
#   映像另外釘了 digest（不用 `:latest`），重建時版本不會偷偷變。
services:
  591-tracker-tunnel-b:
    container_name: 591-tracker-tunnel-b
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    user: "1026:100"
    restart: unless-stopped
    network_mode: host
    # token 不進 argv（`docker inspect`／`ps` 看得到）：改掛檔、唯讀
    volumes:
      - /var/services/homes/tori/5151-shadow/cloudflared-public/secrets:/run/secrets:ro
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/token
    command: tunnel --no-autoupdate run

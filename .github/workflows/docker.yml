name: Docker image (manual)

# :latest 部署路徑已拆除。檔名保留以免舊連結 404。
# 正式發行只走這三個 workflow（皆須從 refs/heads/master 手動 workflow_dispatch）：
#   1. Build production image (no deploy) → .github/workflows/build-production-image.yml
#   2. Production predeploy check (no deploy) → .github/workflows/production-predeploy-check.yml
#   3. Deploy v3 to CasaOS (manual) → .github/workflows/deploy-v3.yml
# 授權檢查與正式部署護欄仍在；實際建置、推送 :latest、SSH、compose pull/up 一律拒絕。
# 合併 / push 到 master 不會觸發本檔，也不會自動部署。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "此路徑已停用。請改走 Build production image / predeploy / Deploy v3。此欄僅為護欄格式。"
        required: true
      confirmation:
        description: "輸入 DEPLOY-PRODUCTION（仍會被拒絕；請改走 Deploy v3）"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  refuse-retired-latest-path:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Authorize production deployment (fail-closed)
        env:
          WF_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRM: ${{ inputs.confirmation }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$WF_REF" != "refs/heads/master" ]; then
            echo "::error::Production deploy must run from the master workflow definition (got $WF_REF)"; exit 1
          fi
          if [ -z "${ALLOWED_ACTOR:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_ALLOWED_ACTOR is not configured; refusing (fail-closed)"; exit 1
          fi
          if [ "$ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::actor '$ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "$TRIGGERING_ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::triggering actor '$TRIGGERING_ACTOR' is not the authorized deployer (re-run by another user is refused)"; exit 1
          fi
          if [ "${CONFIRM:-}" != "DEPLOY-PRODUCTION" ]; then
            echo "::error::confirmation must be exactly DEPLOY-PRODUCTION"; exit 1
          fi
          if ! printf '%s' "${DEPLOY_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
      - name: Checkout master (for ancestry validation)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Validate SHA reachable from origin/master, then check it out
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/master; then
            echo "::error::commit $DEPLOY_SHA is not reachable from origin/master; refusing"; exit 1
          fi
          git checkout --force "$DEPLOY_SHA"
      - name: latest-tag deploy path retired
        run: |
          echo "::error::docker.yml 已停用 :latest 部署路徑。請改走 Build production image → Production predeploy check → Deploy v3 to CasaOS (manual)，並以 sha256 digest 為 Production identity"; exit 1

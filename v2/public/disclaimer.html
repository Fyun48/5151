<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>免責聲明 · 591 物件追蹤（v2）</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1f1a16;
      --muted: #6d645c;
      --line: #e6ddd2;
      --accent: #c45c26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IwanMincho", "Source Han Serif TC", "Noto Serif TC", "PMingLiU", serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #f8e7d4 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
    }
    .wrap { width: min(640px, calc(100vw - 32px)); margin: 40px auto; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.05);
      padding: 28px 26px 24px;
    }
    h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: 0.08em; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
    .body { font-family: "Noto Sans TC", sans-serif; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    a { color: var(--accent); }
    .back { display: inline-block; margin-top: 18px; font-family: "Noto Sans TC", sans-serif; }
    .site-footer {
      margin: 16px 4px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card">
      <h1>免責聲明</h1>
      <p class="sub">免費系統 · 贊助是自願的</p>
      <div class="body" id="text">載入中…</div>
      <a class="back" href="/login.html">返回登入／註冊</a>
    </article>
    <footer class="site-footer">reversal play tech | 逆遊科技</footer>
  </div>
  <script>
    fetch("/api/disclaimer").then((r) => r.json()).then((data) => {
      document.getElementById("text").textContent = data.text || "";
    }).catch(() => {
      document.getElementById("text").textContent = "暫時讀不到免責聲明，請稍後再試。";
    });
  </script>
</body>
</html>

# OPS-only Synology Container Manager compose (PR #369).
# 只跑 5151-ops；不碰 v3 與其它站台服務，不做 v3 部署。
# 路徑可設定（DSM volume 可能是 /volume1、/volume2 …）：
#   OPS_SYNOLOGY_APP_ROOT   → 原始碼根目錄（唯讀 bind mount）
#   OPS_SYNOLOGY_DATA_ROOT  → 資料根目錄（/data，含 ops.db + auth.env）
services:
  5151-ops:
    container_name: 5151-ops
    image: ${OPS_RUNTIME_IMAGE:-ghcr.io/fyun48/5151:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5154:5154"
    environment:
      OPS_HOST: "0.0.0.0"
      OPS_PORT: "5154"
      OPS_DATA_DIR: /data
      TZ: Asia/Taipei
      COOKIE_SECURE: "1"
      # 預設禁止 Production release live mutation；Owner 明確開啟才允許。
      PRODUCTION_RELEASE_ALLOW_LIVE: "0"
    volumes:
      # current 是 symlink → releases/<SHA>；部署切換 current 即切換版本，rollback 切回前一版。
      - ${OPS_SYNOLOGY_APP_ROOT:-/volume1/docker/5151-ops/app}/current/ops:/app/ops:ro
      - ${OPS_SYNOLOGY_DATA_ROOT:-/volume1/docker/5151-ops/data}:/data
    command: ["node", "ops/src/server.js"]

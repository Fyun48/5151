name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Tests only. No review gate, auto-fix, auto-merge, or deployment.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        shell: bash
        run: |
          set -euo pipefail
          npm test

  # astra §3（2026-09-25）：PG 專屬回歸必須在**真 PG**上跑，但**不得**用 job 全域 DB_DRIVER=postgres
  # 把一般 job 的 SQLite／預設 driver 測試整批改成 PG（那會漏測並掩蓋隔離問題）。
  # 因此這裡走獨立入口 `npm run test:pg`：先鏡射 schema，再跑 canary ＋ 所有 PG_TEST_URL-gated 整合測試。
  # 資料庫是**拋棄式**的：絕不把生產連線交給 Actions（PG_URL 只在本 job 指向 service container）。
  test-postgres:
    name: Run Tests (PostgreSQL integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # 固定版本，避免 CI 隨上游漂移（正式環境是 PG 16.14）
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: tracker_test
          # 拋棄式 service container 只綁在 runner 內、job 又是單租戶 ⇒ 用 trust 認證取代寫死的密碼：
          # CI 檔案裡從此**沒有「帳密字串」**，secret 掃描器也沒有東西可以標記 ✗（比忽略規則更乾淨）。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # 統一的測試連線契約：**檔案內沒有帳密**（service container 用 trust 認證，見上）；
      # 連線 URL 在步驟內以非機密變數組出，且只指向 127.0.0.1 的拋棄式資料庫。
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: tracker_test
      PG_STATEMENT_TIMEOUT_MS: "300000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Export disposable test URLs
        shell: bash
        run: |
          set -euo pipefail
          # 應用 driver 讀 PG_URL；live PG 測試讀 PG_TEST_URL（astra §3.3）。兩者都指向本 job 的
          # 拋棄式 service container（trust 認證 ⇒ URL 不含密碼），且執行時才組出。
          url="postgres://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "PG_URL=${url}" >> "$GITHUB_ENV"
          echo "PG_TEST_URL=${url}" >> "$GITHUB_ENV"

      - name: Run PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:pg

      # 43 欄 vs 23 欄 A/B（astra 2026-09-25 裁決 §5A／§6.3）——**診斷、非 gate** ✓。
      #   • 用同一顆已由 pg-integration-setup 灌好 schema ＋ 可重現列的拋棄式 PG ✓
      #   • DATA_DIR 指向獨立暫存目錄 ✓（不可繼承正式 /data —— `db.js` 的 import 會初始化 SQLite ✓）
      #   • 腳本在 repo 內 ⇒ `import "../src/db.js"` 正確解析到 `v3/src/db.js` ✓（不是舊部署映像 ✗）
      #   • 已修正：SQL 一律過 toPostgresSql()、只用根節點 buffers（不逐節點加總）、
      #     端到端 wall／rows／payload、A/B 交替 ＋ 暖機 ✓
      - name: Columns A/B (diagnostic, non-gating)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          export DATA_DIR="$(mktemp -d)"
          export WARMS=2
          export RUNS=5
          node v3/scripts/pg-columns-ab.mjs

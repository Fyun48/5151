name: Production functional UAT Stages 1-4 (manual)
run-name: "uat-stage1-4:${{ inputs.source_sha }}"

# Issue #333 consolidated Production functional UAT for Marketplace Stages 2-4.
# Read-only with respect to feature flags: it never enables/disables a flag,
# never redeploys and never restarts. It creates its own recoverable fixtures and
# cleans them through the existing domain APIs.
# Must be dispatched from refs/heads/master. Actor and triggering_actor must both
# be PRODUCTION_DEPLOY_ALLOWED_ACTOR, plus a per-run Owner authorization bound to
# the running source SHA, image digest and backup identity.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "目前 Production source 的完整 40 碼 commit SHA"
        required: true
      image_digest:
        description: "目前 running image digest，格式必須是 sha256: 加 64 碼小寫 hex"
        required: true
      backup_id:
        description: "已驗證 backup 路徑，必須是 /DATA/AppData/591-tracker-v3-backups/predeploy-YYYYMMDD-HHMMSS"
        required: true
      backup_hash:
        description: "已驗證 backup sha256，格式必須是 sha256: 加 64 碼小寫 hex"
        required: true
      confirmation:
        description: "輸入 UAT-STAGE1-4-PRODUCTION 以確認執行功能性 UAT"
        required: true
        default: ""
      owner_authorization:
        description: "Per-run Owner intent，必須剛好 AUTHORIZE-UAT-STAGE1-4:<source_sha>:<image_digest>:<backup_id>:<backup_hash>"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  uat:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Authorize production UAT (fail-closed)
        env:
          WF_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRM: ${{ inputs.confirmation }}
          OWNER_AUTHORIZATION: ${{ inputs.owner_authorization }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          BACKUP_ID: ${{ inputs.backup_id }}
          BACKUP_HASH: ${{ inputs.backup_hash }}
        run: |
          set -euo pipefail
          if [ "$WF_REF" != "refs/heads/master" ]; then
            echo "::error::production UAT must run from the master workflow definition (got $WF_REF)"; exit 1
          fi
          if [ -z "${ALLOWED_ACTOR:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_ALLOWED_ACTOR is not configured; refusing (fail-closed)"; exit 1
          fi
          if [ "${ACTOR:-}" != "$ALLOWED_ACTOR" ] || [ "${TRIGGERING_ACTOR:-}" != "$ALLOWED_ACTOR" ]; then
            echo "::error::actor '$ACTOR' / triggering actor '$TRIGGERING_ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "${CONFIRM:-}" != "UAT-STAGE1-4-PRODUCTION" ]; then
            echo "::error::confirmation must be exactly UAT-STAGE1-4-PRODUCTION"; exit 1
          fi
          if ! printf '%s' "${SOURCE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be a full 40-character commit SHA"; exit 1
          fi
          if ! printf '%s' "${IMAGE_DIGEST:-}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::image_digest must be exactly sha256: plus 64 lowercase hex characters"; exit 1
          fi
          if ! printf '%s' "${BACKUP_ID:-}" | grep -Eq '^/DATA/AppData/591-tracker-v3-backups/predeploy-[0-9]{8}-[0-9]{6}$'; then
            echo "::error::backup_id must be /DATA/AppData/591-tracker-v3-backups/predeploy-YYYYMMDD-HHMMSS"; exit 1
          fi
          case "$BACKUP_ID" in
            *..*) echo "::error::backup_id must not contain path traversal"; exit 1 ;;
          esac
          if ! printf '%s' "${BACKUP_HASH:-}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::backup_hash must be exactly sha256: plus 64 lowercase hex characters"; exit 1
          fi
          EXPECTED_AUTH="AUTHORIZE-UAT-STAGE1-4:${SOURCE_SHA}:${IMAGE_DIGEST}:${BACKUP_ID}:${BACKUP_HASH}"
          if [ "${OWNER_AUTHORIZATION:-}" != "$EXPECTED_AUTH" ]; then
            echo "::error::owner_authorization must be exactly AUTHORIZE-UAT-STAGE1-4 bound to source SHA, digest, backup id and hash"; exit 1
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"
      - name: Checkout workflow-definition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify trusted workflow-definition SHA
        env:
          EXPECTED_WF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$HEAD_SHA" = "$EXPECTED_WF_SHA" ] || { echo "::error::trusted checkout HEAD $HEAD_SHA != workflow SHA $EXPECTED_WF_SHA"; exit 1; }
      - name: Validate source SHA reachable from origin/master
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master || { echo "::error::commit $SOURCE_SHA is not reachable from origin/master"; exit 1; }
      - name: Copy UAT helpers to the NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: ".github/scripts/production-uat-stages-domain.mjs,.github/scripts/production-uat-stages-wiring.mjs,.github/scripts/production-uat-stages-remote.sh"
          target: /tmp/5151-uat-helpers
          overwrite: true
      - name: Run the consolidated Production UAT
        id: run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export SOURCE_SHA='${{ inputs.source_sha }}'
            export IMAGE_DIGEST='${{ inputs.image_digest }}'
            export BACKUP_ID='${{ inputs.backup_id }}'
            export BACKUP_HASH='${{ inputs.backup_hash }}'
            export RUN_ID='${{ github.run_id }}'
            export RUN_ATTEMPT='${{ github.run_attempt }}'
            export HELPERS_DIR=/tmp/5151-uat-helpers
            export EVIDENCE_OUT=/tmp/uat-stages-evidence-${{ github.run_id }}.json
            bash "$HELPERS_DIR/.github/scripts/production-uat-stages-remote.sh"
      - name: Pull the UAT evidence from the NAS
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p uat-out
          scp -P "${{ secrets.NAS_PORT }}" -o StrictHostKeyChecking=no \
            "${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}:/tmp/uat-stages-evidence-${{ github.run_id }}.json" \
            uat-out/stages-functional-uat-evidence.json \
            || echo "UAT evidence was not produced (fail-closed below)"
      - name: Upload the UAT evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stages-functional-uat-evidence
          path: uat-out/stages-functional-uat-evidence.json
          if-no-files-found: error
      - name: Conclude the UAT (fail-closed)
        run: |
          set -euo pipefail
          EVIDENCE=uat-out/stages-functional-uat-evidence.json
          [ -f "$EVIDENCE" ] || { echo "::error::UAT evidence artifact is missing; refusing PASS"; exit 1; }
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          if doc.get("problems"):
              raise SystemExit("UAT problems: %s" % doc["problems"])
          if doc.get("flags_mutated") is not False:
              raise SystemExit("the UAT mutated feature flags")
          if (doc.get("conclusion") or "") != "ISSUE333_FINAL_UAT_PASS":
              raise SystemExit("UAT conclusion is not ISSUE333_FINAL_UAT_PASS")
          summary = doc.get("summary") or {}
          if summary.get("failed") not in (0, None):
              raise SystemExit("UAT reported failing items: %s" % summary.get("failed_ids"))
          cleanup = doc.get("cleanup") or {}
          if cleanup.get("ok") is not True:
              raise SystemExit("UAT fixture cleanup was not verified")
          flags = (doc.get("after_raw_flags") or {}).get("wish") or {}
          for key in ("owner_matching_enabled", "offer_enabled", "public_share_v2_enabled",
                      "owner_notifications_enabled", "notifications_enabled"):
              if flags.get(key) is not True:
                  raise SystemExit("stage flag %s is not ON after the UAT" % key)
          for key in ("digest_enabled", "outbound_mail_enabled", "outbound_push_enabled"):
              if flags.get(key) is not False:
                  raise SystemExit("outbound channel %s is ON" % key)
          print("ISSUE333_FINAL_UAT_PASS")
          PY


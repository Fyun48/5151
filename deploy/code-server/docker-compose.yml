name: 5151-code-server

# 瀏覽器版 VS Code（code-server）—— 「隨時關掉分頁、下次打開同一個工作區與 session 還在」的雲端 IDE。
# 只綁 127.0.0.1:8484；對外走既有 cloudflared tunnel（jgitea-tunnel 是 --network host、token 遠端管理）：
#   在 Zero Trust → Networks → Tunnels → jgitea-tunnel → Public Hostnames 加一筆
#   code.reversalplay.me → http://localhost:8484（DNS 會自動建立）。
# 刻意**不掛 docker socket**：這只是編輯器，不給它動 host 的能力。
services:
  5151-code-server:
    container_name: 5151-code-server
    image: ${CODE_SERVER_IMAGE:-codercom/code-server:latest}
    restart: unless-stopped
    # 2026-09-22：讓瀏覽器版 IDE 的 Cline 與 Cline Server 容器（`cline-dev`，uid 1001）**共用同一份 Cline 資料**，
    # 這樣「Cline Desktop 連 cline-server 開的 session」在 code-server 的 Cline 面板也看得到（反之亦然）。
    #   ├─ user 1001:1001 ← 與 cline-dev 的 `cline` 同 uid。**必須同 uid**：Cline core 以 0666 & ~umask 建檔，
    #   │                    不同 uid 只能靠群組/ACL 通，new file 會有一邊永遠寫不進去（實測過會壞）。
    #   ├─ group_add 100   ← 保留 `users` 群組 → 仍可寫 `~/inbox`（/nas-inbox 是 2775 root:users）。
    #   ├─ CLINE_DATA_DIR  ← 官方環境變數（Base data directory for sessions/settings/teams/hooks）；
    #   │                    預設就是 `~/.cline/data`，寫出來讓容器內終端機的 `cline` CLI 也指到同一份。
    #   └─ 下面 volumes 多掛 cline-server 的 `.cline/data`（**只掛 data，不掛 ~/.cline**，
    #      `~/.cline/remote` 是 Desktop remote helper 的狀態，不能共用）。
    # 注意：兩邊 Cline 版本要一致（目前 core/extension 皆 4.1.19）；升一邊就要升另一邊，避免 schema migration 互打。
    user: "1001:1001"
    group_add:
      - "100"
    environment:
      CLINE_DATA_DIR: /home/coder/.cline/data
    ports:
      - "127.0.0.1:8484:8080"
    env_file:
      # 密碼只放在 NAS 的 .env（本檔不含任何 password 形狀的字面值，避免 secret scanner 誤報）：
      #   PASSWORD=<值>              ← code-server 讀這個
      #   CODE_SERVER_PASSWORD=<值>  ← 只為向後相容留著
      # `.env` 不在版控內；缺檔時 compose 會直接失敗（fail-closed）。
      - .env
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - --disable-telemetry
      - --disable-update-check
      # 免去「Restricted Mode / 工作區信任」擋掉擴充套件（Cline）的問題。
      - --disable-workspace-trust
      # 預設開在專案區（`/workspace` 底下每個 repo 都會出現在左側；預設值可由 compose 最後這個參數改）。
      - /workspace
    volumes:
      # 設定 / 已安裝擴充套件 / 開啟的工作區都持久化 → 這就是「關掉再打開還在」的關鍵。
      - ./data:/home/coder
      # 2026-09-22：`/workspace` **直接指向 Cline Server 的 repos 根目錄**
      #   IDE 內 `/workspace/<repo>` ↔ NAS `~/code-server/workspace/cline-server/repos/<repo>`
      #   ↔ agent 容器（cline-dev）內 `/workspace/repos/<repo>`
      #   → 跟「Cline Desktop 用 SSH 連 cline-server 工作」看到的是**同一份 working tree**，
      #     不再是兩份各自落後的 clone（原本 code-server 自己那份 18 個 repo 已於 2026-09-22 刪除，
      #     `_uploads` 的兩個檔案已移到 NAS `~/inbox/code-server-old-_uploads/`）。
      - /volume1/homes/tori/code-server/workspace/cline-server/repos:/workspace
      # Cline Server（cline-dev 容器）的 Cline 資料 = **兩邊唯一的 session 來源**。
      # 只掛 `data`（settings/sessions/db/hooks），不掛整個 `~/.cline`（`remote/` 是 Desktop helper 專用）。
      # 副作用：`~/code-server/data/.cline/data` 會被這條覆蓋（原本 code-server 自己的 6 條舊 session
      # 已備份成 `~/code-server/data/.cline/data-code-server-archive-<timestamp>`，檔案還在，只是不在 UI 清單）。
      - /volume1/homes/tori/code-server/workspace/cline-server/home/.cline/data:/home/coder/.cline/data
      # 唯讀的私有憑證（INFRA-CREDENTIALS.md 等）：**不進 repo**，只有這個容器看得到，
      # 而且以 :ro 掛載（容器內改不動）。IDE 內查法：`cat /private/INFRA-CREDENTIALS.md`。
      - ./private:/private:ro
      # NAS 端的存取範圍（2026-09-20 新增；本來 IDE 只看得到上面三條 → 上傳/開啟檔案時
      # 「選不到 NAS 的路徑」，只能靠拖曳進 /workspace）：
      #   1. **不要**掛整個 `/volume1`：VS Code 會對它做 file watcher／索引，11TB 的共享
      #      會把 NAS CPU 與 inotify 額度吃光（`.vscode` 的 watcherExclude 只擋搜尋、不擋 watcher）。
      #   2. ⚠️ **Synology 的 ACL 會蓋掉 777**：`/volume1/homes/tori`、`~/code-server` 都是
      #      `drwxrwxrwx+`，但 ACL 只列了 `user:tori` 與 `group:administrators`、沒有 others
      #      → 容器身分（2026-09-22 起是 uid 1001；在那之前是 1000）連 `ls` 都被拒。
      #      **bind mount 會繞過上層目錄的 ACL**，但**不會**繞過被掛那一個目錄自己的 ACL ——
      #      所以能掛的只有「沒有 Synology ACL、且 owner 是容器身分（1001）」的目錄
      #      （例如 `~/code-server/workspace/cline-server/repos`、下面這個 `~/inbox`）。
      #   3. 需要更多 NAS 路徑（例如分享資料夾、或想直接編輯家目錄裡的 ops 腳本）就要另外處理：
      #      用 root 建目錄＋`chown 1001:1001`，或在 DSM 加 ACL 給容器用的 uid。
      #  /nas-inbox  ← /volume1/homes/tori/inbox（2026-09-20 由 root 建立、owner 1000:users 2775）：
      #                IDE 內可直接上傳／新增檔案到 NAS 的落地區。NAS 端就是 `~/inbox`。
      #                （容器 uid 變成 1001 之後靠 `group_add: 100`（users）維持可寫 ✓）
      #  /nas-docker ← /volume1/docker：各容器的 compose／.env（5151-ops、ecpapi、mbriapi…），
      #                實測可讀、**不可寫**（ACL）→ 標成 `:ro` 讓權限與事實一致。
      - /volume1/homes/tori/inbox:/nas-inbox
      - /volume1/docker:/nas-docker:ro
    networks:
      - gitea

networks:
  gitea:
    # 既有 Gitea 網路：讓容器內可以直接 git clone http://gitea:3000/JimmyGOD/5151.git
    external: true
    name: 5151-gitea_default

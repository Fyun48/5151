name: Deploy v3 to CasaOS (manual)
run-name: "${{ inputs.release_mode == 'ops_phase15' && format('phase15-intent:{0}', inputs.release_intent_id) || format('manual-owner:{0}', inputs.sha) }}"

# Production 部署一律「明確手動觸發」。合併/push 到 master 不會自動部署 v3。
# 部署會把指定 commit SHA 的 v3/src、v3/public 與 compose 檔 SCP 到正式 NAS，
# 並以「已驗證的不可變 image digest」重建 591-tracker-v3。
#
# 本次 #192–#197 發行候選（請用這組，不要改成較新的 workflow-only master SHA）：
#   source: 620c3a2419c6591626eb35df0eba5ce2a13ae2fa
#   tag:    ghcr.io/fyun48/5151:620c3a2419c6591626eb35df0eba5ce2a13ae2fa
#   digest: sha256:17cd853459aab52ca9c32f2d31bb280792ae834073e4b866bb8ea63119896227
#
# 部署前必須已由 Owner 審過「Production predeploy check (no deploy)」為 PASS。
# 本 workflow 不會自動觸發 predeploy check，也不會從其他 workflow 自動部署。
#
# Rollback identity（不在此 workflow 自動還原 DB）：
#   已知先前 Production source：584d583e56151abcf01c972b7bb45a82c73e4596（#191 / deploy-v3 run 34113624372）
#   先前 image digest、DB backup path：以 predeploy check 實際輸出為準，禁止捏造。
#
# release_mode=manual_owner：人工治理路徑，不依賴 Ops Phase 15 / release_intent_id。
# release_mode=ops_phase15：維持既有 Phase 15 綁定（run-name phase15-intent:<id>）。
#
# 【必要前提】master branch protection / ruleset 為必要（防止直接改本 workflow 繞過授權）。
# Owner 已書面授權：Cursor Agent（actor `cursor` / `cursor[bot]`）在使用者要求合併部署時
# 可從 master 觸發本檔；見 AGENTS.md 與 .cursor/rules/owner-merge-deploy.mdc。不套用 Ops Phase 15 停手規則。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "要部署的完整 40 碼 commit SHA（必須可從 origin/master 追溯；#192–#197 請用 620c3a2419c6591626eb35df0eba5ce2a13ae2fa）"
        required: true
      image_digest:
        description: "不可變 image digest，格式必須是 sha256: 加 64 碼小寫 hex（禁止 latest / 可變 tag）"
        required: true
      confirmation:
        description: "輸入 DEPLOY-PRODUCTION 以確認正式部署"
        required: true
        default: ""
      release_mode:
        description: "Release path: manual_owner（人工治理，預設）或 ops_phase15（Ops Phase 15 綁定）"
        type: choice
        required: true
        default: manual_owner
        options:
          - manual_owner
          - ops_phase15
      release_intent_id:
        description: "僅 ops_phase15 必填：Ops Phase 15 durable release_intent_id。manual_owner 必須空白；非空會 fail-closed（避免舊 Phase 15 caller 被降成 Manual Owner）"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync-nas-v3:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Authorize production deployment (fail-closed)
        env:
          WF_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTOR: ${{ vars.PRODUCTION_DEPLOY_ALLOWED_ACTOR }}
          CONFIRM: ${{ inputs.confirmation }}
          DEPLOY_SHA: ${{ inputs.sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
        run: |
          set -euo pipefail
          if [ "$WF_REF" != "refs/heads/master" ]; then
            echo "::error::Production deploy must run from the master workflow definition (got $WF_REF)"; exit 1
          fi
          if [ -z "${ALLOWED_ACTOR:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_ALLOWED_ACTOR is not configured; refusing (fail-closed)"; exit 1
          fi
          CURSOR_DEPLOY=0
          if [ "$ACTOR" = "cursor" ] || [ "$ACTOR" = "cursor[bot]" ]; then
            if [ "$TRIGGERING_ACTOR" = "cursor" ] || [ "$TRIGGERING_ACTOR" = "cursor[bot]" ]; then
              CURSOR_DEPLOY=1
            fi
          fi
          if [ "$CURSOR_DEPLOY" != 1 ] && [ "$ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::actor '$ACTOR' is not the authorized deployer"; exit 1
          fi
          if [ "$CURSOR_DEPLOY" != 1 ] && [ "$TRIGGERING_ACTOR" != "$ALLOWED_ACTOR" ]; then
            echo "::error::triggering actor '$TRIGGERING_ACTOR' is not the authorized deployer (re-run by another user is refused)"; exit 1
          fi
          if [ "${CONFIRM:-}" != "DEPLOY-PRODUCTION" ]; then
            echo "::error::confirmation must be exactly DEPLOY-PRODUCTION"; exit 1
          fi
          if ! printf '%s' "${DEPLOY_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
          if ! printf '%s' "${IMAGE_DIGEST:-}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::image_digest must be exactly sha256: plus 64 lowercase hex characters"; exit 1
          fi
          if [ "${RELEASE_MODE:-}" != "manual_owner" ] && [ "${RELEASE_MODE:-}" != "ops_phase15" ]; then
            echo "::error::release_mode must be manual_owner or ops_phase15 (got '${RELEASE_MODE:-}')"; exit 1
          fi
          if [ "${RELEASE_MODE:-}" = "ops_phase15" ] && [ -z "${RELEASE_INTENT_ID:-}" ]; then
            echo "::error::ops_phase15 requires a non-empty release_intent_id"; exit 1
          fi
          if [ "${RELEASE_MODE:-}" = "manual_owner" ] && [ -n "${RELEASE_INTENT_ID:-}" ]; then
            echo "::error::manual_owner forbids a non-empty release_intent_id; stale Phase 15 callers must set release_mode=ops_phase15"; exit 1
          fi
      - name: Checkout workflow-definition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Stage trusted workflow-definition evidence writers
        env:
          TRUSTED_SCRIPT_DIR: ${{ runner.temp }}/trusted-workflow-scripts
          EXPECTED_WF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Writers must come from this exact workflow-definition commit (github.sha),
          # not a moving master tip and not a later candidate checkout (e.g. #217).
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$EXPECTED_WF_SHA" ]; then
            echo "::error::trusted checkout HEAD $HEAD_SHA != workflow execution SHA $EXPECTED_WF_SHA"; exit 1
          fi
          mkdir -p "$TRUSTED_SCRIPT_DIR"
          cp -f \
            .github/scripts/write-manual-owner-workflow-evidence.py \
            .github/scripts/write-phase15-workflow-evidence.py \
            "$TRUSTED_SCRIPT_DIR/"
          test -s "$TRUSTED_SCRIPT_DIR/write-manual-owner-workflow-evidence.py"
          test -s "$TRUSTED_SCRIPT_DIR/write-phase15-workflow-evidence.py"
          echo "TRUSTED_SCRIPT_DIR=$TRUSTED_SCRIPT_DIR" >> "$GITHUB_ENV"
      - name: Write Phase 15 run identity
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        env:
          TRUSTED_SCRIPT_DIR: ${{ runner.temp }}/trusted-workflow-scripts
          EVIDENCE_KIND: identity
          WF_FILE: .github/workflows/deploy-v3.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 "${TRUSTED_SCRIPT_DIR:?}/write-phase15-workflow-evidence.py" phase15-run-identity.json
      - name: Upload Phase 15 run identity
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase15-run-identity
          path: phase15-run-identity.json
          if-no-files-found: error
      - name: Write Manual Owner run identity
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        env:
          TRUSTED_SCRIPT_DIR: ${{ runner.temp }}/trusted-workflow-scripts
          EVIDENCE_KIND: identity
          RELEASE_MODE: manual_owner
          WF_FILE: .github/workflows/deploy-v3.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 "${TRUSTED_SCRIPT_DIR:?}/write-manual-owner-workflow-evidence.py" manual-owner-run-identity.json
      - name: Upload Manual Owner run identity
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-owner-run-identity
          path: manual-owner-run-identity.json
          if-no-files-found: error
      - name: Validate SHA reachable from origin/master, then check it out
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/master; then
            echo "::error::commit $DEPLOY_SHA is not reachable from origin/master; refusing"; exit 1
          fi
          git checkout --force "$DEPLOY_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidate registry artifact (no rebuild, no push)
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${IMAGE_REPO}:${DEPLOY_SHA}"
          PIN="${IMAGE_REPO}@${IMAGE_DIGEST}"
          echo "candidate_tag=$TAG"
          echo "requested_digest=$IMAGE_DIGEST"
          if ! docker buildx imagetools inspect "$TAG" >/dev/null; then
            echo "::error::candidate tag does not exist: $TAG"; exit 1
          fi
          ACTUAL="$(docker buildx imagetools inspect "$TAG" | awk '/^Digest:/{print $2; found=1} END{if(!found) exit 1}')"
          if ! printf '%s' "$ACTUAL" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve immutable manifest digest for $TAG"; exit 1
          fi
          echo "tag_manifest_digest=$ACTUAL"
          if [ "$ACTUAL" != "$IMAGE_DIGEST" ]; then
            echo "::error::tag digest $ACTUAL != requested $IMAGE_DIGEST"; exit 1
          fi
          docker pull --platform linux/amd64 "$PIN"
          REV="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PIN")"
          SRC="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$PIN")"
          echo "oci_revision=$REV"
          echo "oci_source=$SRC"
          if [ "$REV" != "$DEPLOY_SHA" ]; then
            echo "::error::OCI revision '$REV' != DEPLOY_SHA $DEPLOY_SHA"; exit 1
          fi
          EXPECT_SRC="https://github.com/${GITHUB_REPOSITORY}"
          if [ "${SRC,,}" != "${EXPECT_SRC,,}" ]; then
            echo "::error::OCI source '$SRC' is not this repository"; exit 1
          fi
          docker run --rm --platform linux/amd64 "$PIN" node -e "import('sharp').then(()=>console.log('SHARP_OK')).catch(()=>{console.error('SHARP_MISSING'); process.exit(1)})"
          echo "ARTIFACT_OK tag=$TAG digest=$IMAGE_DIGEST revision=$REV"
      - name: Write v3-only digest compose override
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          umask 022
          {
            echo "# Generated by deploy-v3.yml. Pins ONLY 591-tracker-v3."
            echo "# v1/v2 keep the image defined in docker-compose.yml."
            echo "services:"
            echo "  591-tracker-v3:"
            echo "    image: ${IMAGE_REPO}@${IMAGE_DIGEST}"
          } > docker-compose.override.yml.tmp
          mv docker-compose.override.yml.tmp docker-compose.override.yml
          grep -q "591-tracker-v3" docker-compose.override.yml
          grep -q "@${IMAGE_DIGEST}" docker-compose.override.yml
          if grep -q ':latest' docker-compose.override.yml; then
            echo "::error::override must not contain :latest"; exit 1
          fi
          if grep -q '591-tracker-v2' docker-compose.override.yml || grep -qE '591-tracker:' docker-compose.override.yml; then
            echo "::error::override must pin only 591-tracker-v3"; exit 1
          fi
      - name: Copy v3 app, compose files, and digest override
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: "v3/src,v3/public,docker-compose.yml,casaos-compose.yml,docker-compose.override.yml"
          target: /mnt/Storage1/apps/5151
          overwrite: true
      - name: Pull digest-pinned image and recreate v3 only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            IMAGE_DIGEST='${{ inputs.image_digest }}'
            DEPLOY_SHA='${{ inputs.sha }}'
            IMAGE_PIN="ghcr.io/fyun48/5151@${IMAGE_DIGEST}"
            mkdir -p /DATA/AppData/591-tracker-v3
            copied=0
            if [ -f /DATA/AppData/591-tracker-v2/auth.env ] && [ ! -f /DATA/AppData/591-tracker-v3/auth.env ]; then
              cp /DATA/AppData/591-tracker-v2/auth.env /DATA/AppData/591-tracker-v3/auth.env
              copied=1
            elif [ -f /DATA/AppData/591-tracker/auth.env ] && [ ! -f /DATA/AppData/591-tracker-v3/auth.env ]; then
              cp /DATA/AppData/591-tracker/auth.env /DATA/AppData/591-tracker-v3/auth.env
              copied=1
            fi
            cd /mnt/Storage1/apps/5151
            test -f docker-compose.override.yml
            if grep -q ':latest' docker-compose.override.yml; then
              echo "override contains :latest"; exit 1
            fi
            V3_CFG="$(docker compose -f docker-compose.yml -f docker-compose.override.yml config --format json)"
            V3_IMAGE="$(printf '%s' "$V3_CFG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["591-tracker-v3"]["image"])')"
            V2_IMAGE="$(printf '%s' "$V3_CFG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["591-tracker-v2"]["image"])')"
            echo "rendered_v3_image=$V3_IMAGE"
            echo "rendered_v2_image=$V2_IMAGE"
            if [ "$V3_IMAGE" != "$IMAGE_PIN" ]; then
              echo "rendered v3 image is not the requested digest pin"; exit 1
            fi
            # drone-ssh script_stop joins lines with ';' (in-pattern arms are unsafe).
            if printf '%s' "$V3_IMAGE" | grep -Eq ':latest$'; then
              echo "v3 must not resolve to :latest"; exit 1
            fi
            if printf '%s' "$V2_IMAGE" | grep -Eq '@sha256:'; then
              echo "v2 must not be digest-replaced"; exit 1
            fi
            docker pull "$IMAGE_PIN"
            # Existing intentional v1 leftover stop (v1 already retired). Do not expand to v2.
            docker compose stop 591-tracker || true
            docker stop 591-tracker || true
            docker rm -f 591-tracker || true
            docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --no-build --no-deps --force-recreate 591-tracker-v3
            if [ "$copied" = 1 ]; then
              docker compose -f docker-compose.yml -f docker-compose.override.yml restart 591-tracker-v3
            fi
            ok=0
            for _ in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:5153/api/health | grep -q '"ok":true'; then
                ok=1
                break
              fi
              sleep 1
            done
            [ "$ok" = 1 ] || { docker logs 591-tracker-v3 || true; echo "health did not become ready"; exit 1; }
            curl -fsS -o /tmp/v3-health.json http://127.0.0.1:5153/api/health
            python3 -c 'import json; d=json.load(open("/tmp/v3-health.json")); assert d.get("ok") is True'
            curl -fsS -o /dev/null http://127.0.0.1:5153/
            curl -fsS -o /dev/null http://127.0.0.1:5153/login.html
            RUNNING="$(docker inspect -f '{{.State.Status}}' 591-tracker-v3)"
            [ "$RUNNING" = "running" ]
            CFG_IMAGE="$(docker inspect -f '{{.Config.Image}}' 591-tracker-v3)"
            echo "container_image=$CFG_IMAGE"
            if [ "$CFG_IMAGE" != "$IMAGE_PIN" ]; then
              echo "running container image is not digest-pinned candidate"; exit 1
            fi
            docker exec 591-tracker-v3 node -e "import('sharp').then(()=>console.log('SHARP_OK')).catch(()=>{console.error('SHARP_MISSING'); process.exit(1)})"
            echo "DEPLOY_V3_OK source=$DEPLOY_SHA image=$IMAGE_PIN"
            python3 -c "import json; open('/tmp/phase15-deploy-health.json','w').write(json.dumps({'container_running':True,'health':True,'landing':True,'login':True,'image_digest':'$IMAGE_DIGEST','oci_revision':'$DEPLOY_SHA','container_image':'$IMAGE_PIN'})+'\n')"
      - name: Pull NAS deploy health evidence
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s\n' "$NAS_SSH_KEY" > "$key"
          chmod 600 "$key"
          scp -o StrictHostKeyChecking=accept-new -P "$NAS_PORT" -i "$key" \
            "$NAS_USER@$NAS_HOST:/tmp/phase15-deploy-health.json" ./nas-deploy-health.json
          rm -f "$key"
          python3 - <<'PY'
          import json
          nas = json.load(open("nas-deploy-health.json"))
          required = ("container_running", "health", "landing", "login", "image_digest", "oci_revision")
          if not all(nas.get(k) for k in required):
              raise SystemExit("deploy NAS health evidence incomplete")
          digest = nas["image_digest"]
          revision = nas["oci_revision"]
          if not str(digest).startswith("sha256:") or len(str(digest)) != 71:
              raise SystemExit("deploy NAS health evidence digest is not immutable")
          lines = [
              f"IMAGE_DIGEST={digest}",
              f"OCI_REVISION={revision}",
              "HEALTH_OBSERVED=true",
              f"HEALTH_API={'true' if nas.get('health') else 'false'}",
              f"HEALTH_LANDING={'true' if nas.get('landing') else 'false'}",
              f"HEALTH_LOGIN={'true' if nas.get('login') else 'false'}",
              f"HEALTH_CONTAINER={'true' if nas.get('container_running') else 'false'}",
          ]
          open("phase15-health.env", "w").write("\n".join(lines) + "\n")
          PY
      - name: Write Phase 15 workflow evidence
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        env:
          TRUSTED_SCRIPT_DIR: ${{ runner.temp }}/trusted-workflow-scripts
          WF_FILE: .github/workflows/deploy-v3.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          OCI_SOURCE: https://github.com/${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ -f ./phase15-health.env ]; then
            set -a
            # shellcheck disable=SC1091
            . ./phase15-health.env
            set +a
          fi
          python3 "${TRUSTED_SCRIPT_DIR:?}/write-phase15-workflow-evidence.py" phase15-workflow-evidence.json
      - name: Upload Phase 15 workflow evidence
        if: ${{ always() && inputs.release_mode == 'ops_phase15' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase15-workflow-evidence
          path: phase15-workflow-evidence.json
          if-no-files-found: error
      - name: Write Manual Owner workflow evidence
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        env:
          TRUSTED_SCRIPT_DIR: ${{ runner.temp }}/trusted-workflow-scripts
          RELEASE_MODE: manual_owner
          WF_FILE: .github/workflows/deploy-v3.yml
          WF_REF: ${{ github.ref }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_ATTEMPT: ${{ github.run_attempt }}
          WF_HEAD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.sha }}
          WF_ACTOR: ${{ github.actor }}
          WF_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_INTENT_ID: ${{ inputs.release_intent_id }}
          WF_ENVIRONMENT: production
          OCI_SOURCE: https://github.com/${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ -f ./phase15-health.env ]; then
            set -a
            # shellcheck disable=SC1091
            . ./phase15-health.env
            set +a
          fi
          python3 "${TRUSTED_SCRIPT_DIR:?}/write-manual-owner-workflow-evidence.py" manual-owner-workflow-evidence.json
      - name: Upload Manual Owner workflow evidence
        if: ${{ always() && inputs.release_mode == 'manual_owner' }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-owner-workflow-evidence
          path: manual-owner-workflow-evidence.json
          if-no-files-found: error

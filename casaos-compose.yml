name: 591-tracker

services:
  591-tracker-v3:
    image: ${V3_IMAGE_PIN:-ghcr.io/fyun48/5151@sha256:00bc8c678925c01f80e865d4c788f8e8a709a5ec0a2b01ba22ccaa7c713d7aa6}
    container_name: 591-tracker-v3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5153:5153"
      # 2026-09-24：5155 別名埠已收回（公開入口走 HAProxy 25153），不再發佈第二個埠。
    environment:
      HOST: "0.0.0.0"
      PORT: "5153"
      DATA_DIR: /data
      TZ: Asia/Taipei
      PUBLIC_BASE_URL: https://jibbyrenth.reversalplay.me
      V1_DB_PATH: /v1-data/591.db
      V2_DB_PATH: /v2-data/v2.db
      # PostgreSQL 切換開關（佔位）。預設 sqlite：不設 PG_URL 時行為與現在完全相同。
      # 切換當天只要在 NAS 的 /mnt/Storage1/apps/5151/.env 追加 DB_DRIVER=postgres 與 PG_URL=…
      # 再重建 591-tracker-v3；回復＝把 DB_DRIVER 改回 sqlite／移除後重建。
      # 詳見 docs/runbooks/postgres-cutover-day-checklist.md 步驟 5。
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      PG_URL: ${PG_URL:-}
      # 會員列表「唯讀快照」的待機節點（HAProxy 的 pg_ro，25434）。**開閘＝設這一個鍵**；
      # 未設＝行為與以前逐字相同（連待機池都不建立）。連不上待機時整趟退回 PG_URL，
      # 不會混用兩個快照，並記 [pg-read] warning。詳見 docs/runbooks/member-read-replica-routing.md
      PG_RO_URL: ${PG_RO_URL:-}
      # 正式部署（DB_DRIVER=postgres）一律 strict：讀寫都不回退本機 SQLite。
      PG_SQLITE_FALLBACK: ${PG_SQLITE_FALLBACK:-strict}
      # 節點 SQLite 停用閘：設 1＝節點 SQLite 停用（孤島退場）。預設 1：缺這行的新機器／手動重建
      # 一律預設安全（不再默默降 0、然後被 runtimeGuards 第④刀拒絕啟動）。
      # 唯一例外是爬蟲沙盒（docker-compose.crawl-sandbox.yml 維持 0，原因見 runtimeGuards.js 第④刀）。
      PG_NO_SQLITE_OPEN: ${PG_NO_SQLITE_OPEN:-1}
    volumes:
      - /DATA/AppData/591-tracker-v3:/data
      - /DATA/AppData/591-tracker:/v1-data:ro
      - /DATA/AppData/591-tracker-v2:/v2-data:ro
      - /mnt/Storage1/apps/5151/v3/src:/app/src:ro
      - /mnt/Storage1/apps/5151/v3/public:/app/public:ro
    command: ["node", "--watch-path=src", "--watch-path=public", "src/server.js"]

x-casaos:
  architectures:
    - amd64
    - arm64
  main: 591-tracker-v3
  title:
    en_us: 591 Tracker
    zh_tw: 591 物件追蹤
  description:
    en_us: Track 591 rental listings with viewed, watched, and hidden flags.
    zh_tw: 吉比租房物件追蹤。公開站 v3（5153，jibbyrenth）。v1／v2 已拆除。OPS Console **不屬於這份 app**（2026-10-07 起走自己的 project `5151-ops`／`docker-compose.ops.casaos.yml`）。
  category: Utility
  port_map: "5153"
